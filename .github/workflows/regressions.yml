name: Wonderwood regressions

# Run on demand via the Actions UI or by explicitly updating ci-trigger.txt.
# Ordinary source commits and pull-request updates do not start CI.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/ci-trigger.txt

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Validate AI-authored semantic worlds
        run: |
          node tests/level-designs.mjs
          node scripts/inspect-levels.mjs
          node scripts/export-art-guides.mjs
          node tests/art-guides.mjs
          node tests/route-comparison.mjs
      - name: Verify diffusion scene panels are embedded
        run: node tests/scene-panels.mjs
      - name: Rebuild self-contained game
        run: node scripts/build.mjs
      - name: Verify playable standalone bundle was generated
        run: test -s dist/wonderwood.html
      - name: Run gameplay and browser regressions
        run: |
          python tests/offline_launch.py
          python tests/smoke.py
          python tests/playability.py
          python tests/controller_and_coop.py
          python tests/routes.py
          python tests/terrain_and_flight.py
          python tests/wingbeat_budget.py
          python tests/living_setpieces.py
          python tests/game_feel.py
          python tests/creature_mechanics.py
          python tests/wonder_trails.py
          python tests/painted_illustrations.py
          python tests/painted_panorama.py
          python tests/chapter_composition.py
          python tests/staged_vistas.py
          python tests/semantic_pipeline.py
          python tests/character_packer.py
          python scripts/evaluate-routes.py
          python tests/performance.py
      - name: Upload playable offline preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wonderwood-playable-preview
          path: dist/wonderwood.html
          if-no-files-found: error
      - name: Upload visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wonderwood-previews
          path: |
            dist/preview-*.png
            dist/preview-levels.svg
            dist/level-diagnostics.json
            dist/route-probes.json
            dist/preview-route-probes.svg
            dist/art-jobs.json
            dist/art-guides/*.svg
            dist/performance-report.json
          if-no-files-found: ignore

  phaser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Phaser and browser test dependencies
        run: |
          npm install --prefix phaser --no-audit --no-fund
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Publish isolated gameplay sources for local collision replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-gameplay-source
          path: |
            phaser/src/
            phaser/levels/
            phaser/tests/
            phaser/package.json
            src/platform/world-compiler.js
          if-no-files-found: error
      - name: Test Phaser gameplay and cave geometry
        run: npm test --prefix phaser
      - name: Export and inspect three geometry-derived chapter guides
        if: success() || failure()
        run: |
          node phaser/scripts/export-future-chapter-guides.mjs
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {readFileSync} from "node:fs";
            const chapters=[
              ["sunken-temple",4],["mirror-palace",6],["skybound-stampede",5]
            ];
            for(const [chapter,count] of chapters){
              const directory="dist/future-chapter-guides/"+chapter+"/";
              const manifest=JSON.parse(readFileSync(directory+"manifest.json","utf8"));
              assert.equal(manifest.frames.length,count);
              for(const file of [...manifest.staticLayers,
                ...manifest.frames.map(frame=>frame.file)]){
                const image=readFileSync(directory+file);
                assert.equal(image.subarray(1,4).toString(),"PNG");
                assert.equal(image.readUInt32BE(16),manifest.width);
                assert.equal(image.readUInt32BE(20),manifest.height);
              }
              if(chapter==="sunken-temple"){
                assert.ok(manifest.frames[1].surfaces.courtyard<=42.5+0.001,
                  "high-tide conditioning must be sampled after initial delay");
                const art=JSON.parse(readFileSync(directory+"imagegen-handoff.json","utf8"));
                assert.equal(art.dimensions.width,manifest.width);
                assert.equal(art.dimensions.height,manifest.height);
                assert.equal(art.stateFrames.length,4);
                assert.ok(art.alphaCutouts.some(p=>p.id==="timber-crate"));
                assert.equal(manifest.frames.at(-1).wheelActive,true);
                assert.equal(manifest.frames.at(-1).gates["wheel-gate"],true);
              }else if(chapter==="mirror-palace"){
                assert.equal(manifest.frames[0].gates["atrium-light-gate"],false);
                assert.equal(manifest.frames[1].gates["atrium-light-gate"],true);
                assert.equal(manifest.frames[2].phasePlatforms["atrium-vault-perch"].solid,true);
                assert.equal(manifest.frames[3].gates["gallery-light-gate"],true);
                assert.equal(manifest.frames[4].charged["observatory-ignition"],true);
                assert.equal(manifest.frames[4].gates["observatory-light-gate"],false);
                assert.equal(manifest.frames[5].gates["observatory-light-gate"],true);
              }else{
                assert.equal(manifest.frames[0].phase,"waitingForUnicorns");
                assert.equal(manifest.frames[2].phase,"waitingForPegasi");
                assert.equal(manifest.frames[4].phase,"flightScroll");
              }
            }
          '
      - name: Render Temple geometry-registered composition, states and alpha sprites
        if: success() || failure()
        run: |
          python phaser/scripts/render-temple-art-studies.py
          test -s dist/future-chapter-guides/sunken-temple/composition-study.png
          test -s dist/future-chapter-guides/sunken-temple/context-high-tide.png
          test -s dist/future-chapter-guides/sunken-temple/object-studies/timber-crate.png
      - name: Upload exact geometry guides for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-geometry-review
          path: dist/future-chapter-guides/
          if-no-files-found: ignore
      - name: Build standalone Phaser game
        run: |
          npm run build --prefix phaser
          test -s dist/wonderwood-phaser.html
      - name: Verify chapter selection and painting in Chromium
        run: python phaser/tests/chapters.py
      - name: Exercise all three grayboxes with real Chromium input
        run: python phaser/scripts/run-playwright-inline.py phaser/tests/temple_graybox.py
      - name: Upload Chromium collision screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-collision-captures
          path: dist/graybox-screenshots/*.png
          if-no-files-found: ignore
      - name: Upload complete playable game (including three grayboxes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wonderwood-main-game-with-grayboxes
          path: dist/wonderwood-phaser.html
          if-no-files-found: error
      - name: Upload playable Phaser and Cavern Ascent preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cavern-ascent-phaser-preview
          path: |
            dist/wonderwood-phaser.html
            dist/phaser-chapter-cavern-ascent.png
          if-no-files-found: ignore
