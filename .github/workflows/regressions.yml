name: Wonderwood regressions

on:
  push:
    branches:
      - main
      - design/storybook-remaster
      - feature/intentional-gameplay
  pull_request:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Rebuild self-contained game
        run: node scripts/build.mjs
      - name: Verify playable standalone bundle was generated
        run: test -s dist/wonderwood.html
      - name: Run gameplay and browser regressions
        run: |
          python tests/smoke.py
          python tests/playability.py
          python tests/routes.py
          python tests/game_feel.py
          python tests/semantic_pipeline.py
      - name: Upload playable offline preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wonderwood-playable-preview
          path: dist/wonderwood.html
          if-no-files-found: error
      - name: Upload visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wonderwood-previews
          path: dist/preview-*.png
          if-no-files-found: ignore
