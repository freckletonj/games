name: Wonderwood regressions

on:
  push:
    branches:
      - main
      - design/storybook-remaster
      - feature/intentional-gameplay
  pull_request:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Validate AI-authored semantic worlds
        run: |
          node tests/level-designs.mjs
          node scripts/inspect-levels.mjs
          node scripts/export-art-guides.mjs
          node tests/art-guides.mjs
          node tests/route-comparison.mjs
      - name: Verify diffusion scene panels are embedded
        run: node tests/scene-panels.mjs
      - name: Rebuild self-contained game
        run: node scripts/build.mjs
      - name: Verify playable standalone bundle was generated
        run: test -s dist/wonderwood.html
      - name: Run gameplay and browser regressions
        run: |
          python tests/offline_launch.py
          python tests/smoke.py
          python tests/playability.py
          python tests/controller_and_coop.py
          python tests/routes.py
          python tests/terrain_and_flight.py
          python tests/wingbeat_budget.py
          python tests/living_setpieces.py
          python tests/game_feel.py
          python tests/creature_mechanics.py
          python tests/wonder_trails.py
          python tests/painted_illustrations.py
          python tests/painted_panorama.py
          python tests/chapter_composition.py
          python tests/staged_vistas.py
          python tests/semantic_pipeline.py
          python tests/character_packer.py
          python scripts/evaluate-routes.py
          python tests/performance.py
      - name: Upload playable offline preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wonderwood-playable-preview
          path: dist/wonderwood.html
          if-no-files-found: error
      - name: Upload visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wonderwood-previews
          path: |
            dist/preview-*.png
            dist/preview-levels.svg
            dist/level-diagnostics.json
            dist/route-probes.json
            dist/preview-route-probes.svg
            dist/art-jobs.json
            dist/art-guides/*.svg
            dist/performance-report.json
          if-no-files-found: ignore

  phaser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Phaser build and browser test dependencies
        run: |
          npm install --prefix phaser --no-audit --no-fund
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Validate Cavern Ascent gameplay
        run: npm test --prefix phaser
      - name: Build playable Phaser campaign
        run: npm run build --prefix phaser
      - name: Exercise new chapter in Chromium
        run: python phaser/tests/chapters.py
      - name: Compare source painting with authored cave geometry
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          import json, io, base64
          with open("phaser/levels/cavern-ascent.json") as source:
              layout=json.load(source)
          im=Image.open("temp/cave.png").convert("RGB").resize((1280,3200),Image.Resampling.LANCZOS)
          draw=ImageDraw.Draw(im,"RGBA")
          for rock in layout["rockPolygons"]:
              xy=[(x*16,y*16) for x,y in rock["points"]]
              draw.line(xy+[xy[0]],fill=(240,55,180,225),width=10)
          for ledge in layout["shelves"]:
              x,y,length=ledge["x"],ledge["y"],ledge["length"]
              draw.line([(x*16,y*16),((x+length)*16,y*16)],fill=(30,255,255,255),width=13)
          for obj in layout["machines"]:
              x,y=obj["home"]
              draw.ellipse((x-13,y-13,x+13,y+13),fill=(50,255,80,255))
          im.thumbnail((300,750))
          stream=io.BytesIO()
          im.save(stream,format="JPEG",quality=65)
          print("ASSET_GEOMETRY="+base64.b64encode(stream.getvalue()).decode())
          PY
      - name: Inspect source artwork
        run: |
          python -c 'from PIL import Image; from io import BytesIO; import base64; from pathlib import Path; [(lambda im,name: (print("ASSET_SIZE="+name+":"+str(im.size)), (lambda b: (im.thumbnail((260,650)), im.convert("RGB").save(b,format="JPEG",quality=60), print("ASSET_PREVIEW="+name+":"+base64.b64encode(b.getvalue()).decode())))(BytesIO())))(Image.open("temp/"+name+".png"),name) for name in ("cave","bridge","boulders")]'
