<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Adventure Town · Emberbrook</title>
    <link rel="stylesheet" href="game/style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="view" aria-label="Playable 3D fantasy village"></canvas>
    </div>
    <div id="hud">
      <div class="eyebrow">Emberbrook · riverside rambles</div>
      <h1>Adventure Town</h1>
      <div id="area">Willowbank village</div>
    </div>
    <div id="top">
      <button id="orbit">Rotate view</button><button id="zoom">Zoom out</button
      ><button id="reset">Respawn</button>
    </div>
    <div id="bottom">
      <div>
        <kbd>W A S D</kbd> / <kbd>↑ ← ↓ →</kbd> Move &nbsp; <kbd>Shift</kbd> Run
        &nbsp; <kbd>Space</kbd> Jump &nbsp; <kbd>Q</kbd> <kbd>E</kbd> Orbit
        &nbsp; <kbd>F</kbd> Use / Enter
      </div>
      <div id="info">Loading world…</div>
    </div>
    <canvas id="map" width="264" height="192" aria-label="Village map"></canvas>
    <div id="message" role="status"></div>
    <button id="interact" hidden>Enter</button>
    <div id="touch">
      <div id="dpad">
        <button data-key="KeyW">↑</button><button data-key="KeyA">←</button
        ><button data-key="KeyS">↓</button><button data-key="KeyD">→</button>
      </div>
      <div id="actions">
        <button data-key="ShiftLeft">Run</button
        ><button data-key="Space">Jump</button>
      </div>
    </div>
    <div id="error"></div>
    <script type="module" src="game/main.js"></script>
  </body>
</html>
