  <title id="title">Cavern Ascent layout</title>
  <desc id="desc">The cave rises from the lower-left entrance to the upper-right summit. The stone bridge is shown upright in gold and fallen in dashed cyan, joining the two marked banks. Gaps between the spinning boulders drop to a lower landing.</desc>
