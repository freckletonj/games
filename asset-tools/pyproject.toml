[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "game-asset-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.1", "Pillow==13.0.0", "httpx[socks]==0.28.1", "pydantic==2.14.4", "starlette==1.10.0"]

[project.optional-dependencies]
deploy = ["huggingface-hub==0.36.0"]

[project.scripts]
asset-service = "asset_service.cli:main"

[tool.setuptools.packages.find]
include = ["asset_service*"]
