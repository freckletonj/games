<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wonderwood · Family Adventure Arcade</title>
  <meta name="theme-color" content="#152736">
  <style>:root {
  color-scheme: dark;
  --ink: #0c1d2a;
  --night: #122b39;
  --pine: #1c4b4c;
  --mint: #a6e6c7;
  --gold: #f6d58b;
  --cream: #fff4dd;
  --muted: #bbd4d0;
  font-family: "Trebuchet MS", "Avenir Next", ui-rounded, system-ui, sans-serif;
  color: var(--cream);
  background: var(--ink);
  font-synthesis: none;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(ellipse at 50% 15%, #34535c, #101d2b 66%, #080f1c);
}
button, input, select { font: inherit; }
button { cursor: pointer; border: 0; }
button:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid #ffe5a2; outline-offset: 3px;
}
#app {
  position: relative; width: min(100vw, 177.7778dvh); max-height: 100dvh;
  aspect-ratio: 16/9; overflow: hidden; isolation: isolate;
  background: #2f6173; box-shadow: 0 30px 100px #050b14d9;
}
#game { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
.menu {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: clamp(10px, 2vw, 25px); overflow: auto;
  background: linear-gradient(112deg, #091a2be6 0%, #0f263bc7 45%, #10263bb0 100%);
  backdrop-filter: blur(5px);
}
.menu[hidden], #hud[hidden], #ability-callout[hidden] { display: none !important; }
.panel {
  --panel-edge: #9cccb5;
  position: relative; width: min(820px, 96%); max-height: 100%; overflow: auto;
  padding: clamp(19px, 2.8vw, 36px);
  border: 1px solid #b9d9c5b3; border-radius: 22px; text-align: center;
  background: linear-gradient(150deg, #173444f5, #102432f7 62%, #172c39f6);
  box-shadow: 0 0 0 5px #10253699, 0 0 0 6px #d5bd8d57, 0 26px 75px #03111fd9;
  scrollbar-width: thin; scrollbar-color: #739c92 transparent;
  animation: panel-appear .42s cubic-bezier(.2,.7,.1,1) both;
}
.panel::before {
  content: ""; position: absolute; inset: 9px; pointer-events: none; border-radius: 14px;
  border: 1px solid #a6d5b61f;
}
@keyframes panel-appear { from { opacity: 0; transform: translateY(10px) scale(.987); } to { opacity: 1; transform: none; } }
.kicker {
  margin: 0 0 12px; color: var(--mint); font-size: clamp(10px,1.05vw,13px); font-weight: 800; line-height: 1.4;
  letter-spacing: .28em; text-transform: uppercase;
}
h1, h2, h3 { font-family: Georgia, "Palatino Linotype", serif; font-weight: 700; }
h1 { margin: 0 0 10px; font-size: clamp(40px,5.1vw,72px); line-height: .98; letter-spacing: -.055em; color: var(--gold); text-shadow: 0 4px 18px #071a26a6; }
h2 { margin: 0 0 13px; font-size: clamp(21px,2.5vw,33px); line-height: 1.16; color: #fff1d1; }
h3 { color: var(--gold); }
p { margin: 12px 0 20px; font-size: clamp(12px,1.17vw,15px); line-height: 1.65; color: #c7dddb; }
.buttons { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; }
.primary, .secondary {
  min-height: 43px; padding: 11px 19px; border-radius: 9px;
  font-size: clamp(11px,1.08vw,14px); font-weight: 900; letter-spacing: .045em;
  transition: transform .18s, background-color .18s, box-shadow .18s;
}
.primary { background: #f4d28b; color: #203344; box-shadow: inset 0 1px #fff5d3, 0 4px 0 #a77d48, 0 8px 22px #07131d6b; }
.secondary { background: #254b55; border: 1px solid #83b6a88a; color: #f8f0dc; box-shadow: 0 3px 0 #0a2630; }
.primary:hover, .secondary:hover { transform: translateY(-3px); filter: brightness(1.07); }
.primary:active, .secondary:active { transform: translateY(2px); box-shadow: none; }
.hint { color: #adc9c2; font-size: 12px; line-height: 1.5; }
.instructions { margin-top: 20px; color: #a9c4c1; font-size: 12px; line-height: 1.8; }
.instructions b { color: #f1d69b; }
.row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 14px; margin: 11px 0; }
label { font-size: 14px; color: #e1eee3; }
.toggle { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 8px; }
input[type=checkbox] { accent-color: #aedfc8; }
select, input[type=number] { padding: 9px 11px; border: 1px solid #76a89e; border-radius: 7px; color: #fff4dc; background: #102c3b; }
input[type=file] { max-width: 220px; font-size: 12px; }
.warning { color: #ffb5a5; }

/* Main menu: a storybook title spread, not a configuration dialog. */
.panel-home { width: min(1080px, 96%); padding: clamp(25px,3.1vw,43px); text-align: left; overflow: auto; }
.home-layout { display: grid; grid-template-columns: minmax(0, 1.14fr) minmax(240px, .86fr); align-items: stretch; gap: clamp(10px,2.5vw,36px); }
.home-copy { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 10px 0; }
.home-copy .kicker { margin-bottom: 17px; }
.home-copy h1 { font-size: clamp(56px,6.25vw,91px); letter-spacing: -.065em; white-space: nowrap; }
.home-copy h1 span { color: #e8f3db; }
.home-copy h2 { max-width: 570px; margin: 8px 0; font-size: clamp(24px,2.7vw,37px); font-weight: normal; font-style: italic; letter-spacing: -.025em; }
.home-copy p { max-width: 500px; margin: 15px 0 23px; }
.home-rule { display: flex; align-items: center; width: 100%; gap: 11px; margin: 0 0 8px; color: #e7c88d; font-size: 13px; letter-spacing: .2em; }
.home-rule::after { content: ""; height: 1px; flex: 1; background: linear-gradient(90deg,#d5c18b91,transparent); }
.home-copy .buttons { justify-content: flex-start; }
.home-copy .primary { padding-inline: 25px; }
.home-note { margin-top: 19px; color: #b3d5cd; font-size: 11px; letter-spacing: .13em; text-transform: uppercase; }
.home-art {
  position: relative; isolation: isolate; min-height: 375px; align-self: stretch;
  border-radius: 48% 48% 18px 18px / 40% 40% 18px 18px;
  border: 1px solid #d5c68d75;
  background: radial-gradient(ellipse at 50% 35%, #8cb4aa 0%, #466f76 30%, #213f50 60%, #112734 85%);
  box-shadow: inset 0 0 65px #091d2caa, 0 0 0 6px #afc6a10c;
  overflow: hidden;
}
.home-art::before { content: ""; position: absolute; width: 40%; aspect-ratio: 1; top: 12%; left: 30%; border-radius: 50%; background: #f7e5b0; box-shadow: 0 0 32px 12px #f3d8a66e, 0 0 100px 33px #c8e3cc5e; opacity: .82; }
.home-art::after { content: ""; position: absolute; inset: auto -5% -5%; height: 39%; border-radius: 50% 50% 0 0; background: linear-gradient(180deg, #32665f, #112e3a 70%); box-shadow: 0 -12px 40px #c1e8c135; z-index: -1; }
.art-stars { position: absolute; inset: 0; background-image: radial-gradient(circle,#fcebbe 1.5px,transparent 2px),radial-gradient(circle,#d5f9e2 1px,transparent 2px); background-position: 19px 35px, 70px 106px; background-size: 86px 99px, 114px 126px; opacity: .6; }
.art-orbit { position: absolute; inset: 8%; border: 1px solid #f3e4bd51; border-radius: 50%; transform: rotate(-22deg); }
.art-orbit::after { content: ""; position: absolute; inset: 12%; border: 1px dashed #c6ebdd55; border-radius: 50%; }
.art-portrait { position: absolute; width: 29%; aspect-ratio: 1; border: 3px solid #ecdcad; border-radius: 16px; padding: 5px; background: #1d3b4a; box-shadow: 0 12px 22px #091c29aa, 0 0 0 5px #a8cead3b; transform: rotate(var(--tilt)); animation: portrait-float 4.8s ease-in-out infinite alternate; }
.art-portrait img { width: 100%; height: 100%; object-fit: cover; border-radius: 9px; image-rendering: pixelated; }
.art-portrait:nth-of-type(3) { left: 10%; top: 19%; --tilt: -12deg; }
.art-portrait:nth-of-type(4) { right: 10%; top: 24%; --tilt: 11deg; animation-delay: -1.5s; }
.art-portrait:nth-of-type(5) { left: 20%; bottom: 15%; --tilt: 7deg; animation-delay: -2.2s; }
.art-portrait:nth-of-type(6) { right: 15%; bottom: 14%; --tilt: -9deg; animation-delay: -.8s; }
@keyframes portrait-float { to { transform: translateY(-9px) rotate(var(--tilt)); } }
.art-caption { position: absolute; bottom: 6%; left: 0; right: 0; text-align: center; color: #fae6b7; font-size: 10px; font-weight: 900; letter-spacing: .27em; text-shadow: 0 2px 6px #0d2835; }
.home-bottom { border-top: 1px solid #93b5a65c; margin-top: 21px; padding-top: 14px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.home-bottom .buttons { gap: 8px; }
.home-bottom .secondary { min-height: 32px; padding: 7px 11px; font-size: 11px; background: transparent; border-color: #8db2a14d; box-shadow: none; }
.control-guide { margin-top: 11px; font-size: 11px; color: #bad3c9; }
.control-guide summary { cursor: pointer; color: #edd6a4; width: fit-content; }
.control-guide .instructions { margin: 8px 0 0; font-size: 11px; }

/* Map selection, field guide and utility screens. */
.chapter-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 13px; margin: 22px 0; text-align: left; }
.chapter-card { position: relative; display: flex; flex-direction: column; min-width: 0; padding: 16px; border: 1px solid #91bfae9e; border-radius: 14px; background: linear-gradient(150deg,#285b5c,#153b4a 75%,#112f3e); box-shadow: inset 0 1px #f3f1cf24, 0 8px 18px #031b2780; overflow: hidden; }
.chapter-card.coast { background: linear-gradient(150deg,#2b7180,#164b66 73%,#103b51); }
.chapter-card.summit { background: linear-gradient(150deg,#645b89,#343f6c 73%,#202b53); }
.chapter-card::before { content: ""; position: absolute; top: -28px; right: -15px; width: 138px; height: 138px; border: 1px solid #eef5d533; border-radius: 50%; pointer-events: none; }
.chapter-illustration { align-self: flex-end; width: 80px; height: 80px; margin: -4px 0 -4px; border-radius: 50%; border: 1px solid #e7e9cd75; padding: 9px; background: #153642a6; box-shadow: 0 0 22px #dceebc30; }
.chapter-illustration img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; image-rendering: pixelated; }
.chapter-number { color: #cde7d0; font-size: 10px; font-weight: 900; letter-spacing: .15em; text-transform: uppercase; }
.chapter-card h2 { margin: 4px 0 8px; font-size: clamp(20px,2vw,27px); }
.chapter-card p { margin: 0 0 15px; min-height: 72px; font-size: 12px; }
.chapter-stats { margin-top: auto; margin-bottom: 15px; color: #f1dca7; font-size: 11px; }
.chapter-card button { width: 100%; }
.menu-portraits { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 12px 0; }
.menu-creature { width: 53px; height: 53px; padding: 3px; border: 1px solid #c1dcc9; border-radius: 10px; background: #1d4052; }
.menu-creature img { width: 100%; height: 100%; border-radius: 6px; image-rendering: pixelated; }
.journal-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; margin: 18px 0; text-align: left; }
.journal-card { display: flex; gap: 11px; align-items: center; border: 1px solid #8eb7ac63; border-radius: 11px; padding: 10px; background: #224452ad; }
.journal-card img { flex: none; width: 56px; height: 56px; border: 1px solid #b5d5b3; border-radius: 8px; image-rendering: pixelated; }
.journal-card b { display: block; color: #f5dfa9; }
.journal-card small { display: block; margin-top: 4px; color: #c3d9d5; font-size: 11px; line-height: 1.5; }
.guide-foods { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
.food-guide { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border: 1px solid #8ab1a15e; border-radius: 9px; background: #20404f; font-size: 12px; }
.food-guide img { width: 28px; height: 28px; image-rendering: pixelated; }
.food-guide small { color: #b1c8ce; }

/* In-game information stays out of the way of the landscape. */
#hud { position: absolute; inset: 0 0 auto; display: flex; align-items: flex-start; justify-content: space-between; gap: 9px; padding: 8px 12px; pointer-events: none; font-size: 12px; text-shadow: 0 1px 2px #0b1b30; }
.compact-players { display: flex; flex-wrap: wrap; gap: 6px; max-width: 72%; }
.compact-player { display: flex; align-items: center; gap: 5px; height: 40px; padding: 4px 7px; border: 1px solid #a0d8c6a8; border-radius: 10px; white-space: nowrap; color: #fff6dc; background: #102b3cde; box-shadow: 0 3px 13px #08202c80, inset 0 1px #b2dcc840; backdrop-filter: blur(4px); }
.compact-player.p2 { border-color: #c3b0f3a8; }
.compact-player b { color: #f5d58c; font-size: 11px; }
.mini-hearts { color: #ff9c9f; letter-spacing: -2px; font-size: 15px; }
.mini-form { display: flex; align-items: center; gap: 3px; border-radius: 6px; padding: 2px; background: #214c58; border: 1px solid #6ba999; }
.mini-form.morphed { background: #72566c; border-color: #f3db91; }
.mini-form img { width: 26px; height: 26px; image-rendering: pixelated; border-radius: 4px; }
.mini-form span { min-width: 20px; text-align: center; color: #fae5b0; font-size: 10px; }
.mini-label { max-width: 150px; overflow: hidden; text-overflow: ellipsis; font-size: 10px; color: #d9e9dd; }
.mini-food { display: flex; align-items: center; gap: 3px; color: #dcf9e7; font-size: 10px; }
.mini-food img { width: 19px; height: 19px; image-rendering: pixelated; }
.compact-quest { display: flex; align-items: center; gap: 5px; min-height: 39px; padding: 7px 10px; background: #102b3cde; border: 1px solid #b8d6b79e; border-radius: 10px; white-space: nowrap; box-shadow: 0 3px 13px #08202c80; backdrop-filter: blur(4px); }
.compact-quest b { color: #fff0c7; font: 700 12px Georgia,serif; }
.quest-gem { margin-left: 3px; color: #547782; font-size: 15px; }
.quest-gem.found { color: #f7d58f; text-shadow: 0 0 9px #ffe9a8; }
.compact-quest small { color: #afe4d0; font-size: 10px; }
#message { position: absolute; left: 50%; bottom: 13%; transform: translateX(-50%); max-width: min(82%,820px); padding: 11px 18px; text-align: center; font: 700 clamp(11px,1.42vw,17px)/1.4 Georgia,serif; letter-spacing: .01em; color: #fff3d3; background: #132b38d9; border: 1px solid #d8ce9c70; border-radius: 10px; box-shadow: 0 8px 30px #051b2d8c; pointer-events: none; opacity: 0; transition: opacity .22s; }
#message.show { opacity: 1; }
#ability-callout { position: absolute; top: 13%; left: 50%; z-index: 2; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; width: min(430px,77%); padding: 12px 15px; color: #fff1ce; border: 1px solid #f0d69b; border-radius: 12px; background: #173748f0; box-shadow: 0 12px 32px #071b2a9e, inset 0 1px #fff4d13b; pointer-events: none; }
#ability-callout img { width: 57px; height: 57px; border: 2px solid #adddc4; border-radius: 8px; image-rendering: pixelated; }
#ability-callout strong { display: block; color: #ffdfa4; font: bold 19px Georgia,serif; }
#ability-callout small { display: block; margin-top: 4px; color: #d5eee4; font-size: 12px; line-height: 1.4; }

@media (max-width: 950px) {
  .panel-home { padding: 23px; }
  .home-layout { grid-template-columns: minmax(0,1fr) minmax(200px,.7fr); }
  .home-copy h1 { font-size: clamp(43px,6.5vw,70px); }
  .home-art { min-height: 310px; }
  .chapter-illustration { width: 65px; height: 65px; }
  .chapter-card { padding: 11px; }
  .chapter-card p { min-height: 83px; }
}
@media (max-width: 700px), (max-height: 520px) {
  .panel { padding: 17px; border-radius: 15px; }
  .home-layout { grid-template-columns: 1fr; }
  .home-copy { padding: 0; }
  .home-copy .kicker { margin-bottom: 9px; }
  .home-copy h1 { font-size: clamp(39px,8vw,60px); }
  .home-copy h2 { font-size: clamp(20px,4.2vw,28px); }
  .home-copy p { margin: 8px 0 14px; }
  .home-art { display: none; }
  .home-bottom { margin-top: 12px; padding-top: 10px; }
  .chapter-grid { grid-template-columns: 1fr; gap: 10px; }
  .chapter-card { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; }
  .chapter-card .chapter-number, .chapter-card h2, .chapter-card p, .chapter-card .chapter-stats, .chapter-card button { grid-column: 1; }
  .chapter-card .chapter-illustration { grid-column: 2; grid-row: 1 / span 3; }
  .chapter-card p { min-height: 0; margin: 0; }
  .chapter-card h2 { margin: 0; }
  .chapter-card button { margin-top: 6px; }
  .journal-grid { grid-template-columns: 1fr; }
  .compact-player { height: 32px; gap: 3px; padding: 2px 4px; }
  .mini-form img { width: 20px; height: 20px; }
  .mini-label { display: none; }
  .mini-hearts { font-size: 11px; }
  .compact-quest { min-height: 31px; gap: 2px; padding: 5px; }
  .compact-quest b { font-size: 10px; }
  .compact-quest small { font-size: 9px; }
  #hud { padding: 5px; gap: 4px; }
  #ability-callout { width: min(400px,90%); top: 16%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* Gameplay: information lives at the edges, leaving the center of the world clear. */
.compact-player { height: 36px; padding: 3px 8px; border-color: #a0d8c680; background: #102b3ce8; }
.compact-player .mini-form { background: #174d56; }
.compact-player .mini-form.morphed { background: #72576d; }
.compact-player .mini-food { padding-left: 6px; border-left: 1px solid #739e8f66; color: #f6e1b3; font-weight: 800; }
.compact-player .mini-label { font-size: 10px; }
.compact-quest { min-height: 36px; background: #102b3ce5; }
.compact-quest .quest-gem { color: #86a39d; font-size: 16px; }
.compact-quest .quest-gem.found { color: #ffdfa2; }
#ability-callout {
  top: 14%; left: 14px; transform: none; width: min(340px,56%);
  padding: 10px 12px; gap: 9px;
  background: #102e40ef; border-color: #a5d6b8;
}
#ability-callout strong { font-size: 16px; }
#ability-callout small { font-size: 11px; }
#ability-callout img { width: 46px; height: 46px; }
@media (max-width: 700px), (max-height: 520px) {
  .compact-player { height: 31px; padding: 2px 4px; }
  .compact-player .mini-food { padding-left: 3px; }
  .compact-quest { min-height: 31px; }
  #ability-callout { top: 18%; width: min(290px,68%); padding: 8px; }
}
</style>

<body>
  <main id="app">
    <canvas id="game" width="1440" height="810" aria-label="Wonderwood game world"></canvas>
    <div id="hud" hidden></div>
    <div id="message" aria-live="polite"></div>
    <div id="ability-callout" hidden aria-live="polite"></div>
    <div id="menu" class="menu"></div>
  </main>
  <script>
window.WW = window.WW || {};
WW.storage = (() => {
  const KEY = 'wonderwood-save-v1';
  const initial = () => ({ settings: { rumble: true, sound: true, players: 1 }, profiles: {}, progress: { wins: 0 } });
  let data = initial();
  function load() {
    const stored = localStorage.getItem(KEY);
    if (stored) {
      const parsed = JSON.parse(stored);
      data = { ...initial(), ...parsed, settings: { ...initial().settings, ...parsed.settings } };
    }
    return data;
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(data)); }
  function exportSave() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'wonderwood-save.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  async function importSave(file) {
    const incoming = JSON.parse(await file.text());
    if (!incoming || typeof incoming !== 'object' || !incoming.settings || !incoming.profiles) throw Error('Not a Wonderwood save file');
    data = { ...initial(), ...incoming, settings: { ...initial().settings, ...incoming.settings } }; save();
  }
  return { load, save, exportSave, importSave, get data() { return data; } };
})();

</script>
<script>
window.WW = window.WW || {};
WW.input = (() => {
  const actions = ['left','right','down','jump','snack','orb','cycle','transform','revive','foodCycle','recall'];
  const defaults = { left:[{type:'axis',index:0,sign:-1},{type:'button',index:14}],right:[{type:'axis',index:0,sign:1},{type:'button',index:15}],down:[{type:'axis',index:1,sign:1},{type:'button',index:13}],jump:[{type:'button',index:0}],snack:[{type:'button',index:1}],orb:[{type:'button',index:2}],cycle:[{type:'button',index:5}],transform:[{type:'button',index:3}],revive:[{type:'button',index:4}],foodCycle:[{type:'button',index:7}],recall:[{type:'button',index:8}] };
  const keyMaps = [ { left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],down:['KeyS','ArrowDown'],jump:['KeyW','Space','ArrowUp'],snack:['KeyF'],orb:['KeyG'],cycle:['KeyQ'],transform:['KeyT'],revive:['KeyR'],foodCycle:['KeyE'],recall:['KeyC'] }, { left:['KeyJ'],right:['KeyL'],down:['KeyK'],jump:['KeyI'],snack:['KeyO'],orb:['KeyP'],cycle:['KeyH'],transform:['KeyU'],revive:['KeyY'],foodCycle:['KeyM'],recall:['KeyN'] } ];
  const keys = new Set(); const prev = [new Set(), new Set()]; const assigned = new Map();
  addEventListener('keydown', e => {if (/^(Arrow|Space)/.test(e.code) && document.getElementById('menu')?.hidden) e.preventDefault(); keys.add(e.code);});

<script>
window.WW = window.WW || {};
WW.levels = (() => {
  const colors = {
    empty: '#ffffff', ground: '#101820', platform: '#5f5b85', water: '#176ad7', p1: '#00ed31', p2: '#91fe54', exit: '#ff152b',
    springaroo: '#ffdc12', skyling: '#00eeef', tideling: '#ef851a', snack: '#ff64bb', skyKey: '#b052fc', diveKey: '#167b86', springKey: '#e83c86', checkpoint: '#aaaaaa',cloudwhisp:'#9480ed',prismtail:'#ff895d',mossback:'#6b9c42',glimmermoth:'#ce6dff',emberkit:'#fc5d3e',starShard:'#f2f28a',thermal:'#8af1f9',prismKey:'#ffa03e',mossKey:'#82e561',cloudKey:'#c9adfb',emberKey:'#f54848'
  };
  const palette = Object.entries(colors).map(([name,hex])=>({ name, rgb: [1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)) }));
  const kinds = new Set(['ground','platform','water','thermal']);
  const markers = new Set(['p1','p2','exit','springaroo','skyling','tideling','cloudwhisp','prismtail','mossback','glimmermoth','emberkit','snack','skyKey','diveKey','springKey','starShard','checkpoint','prismKey','mossKey','cloudKey','emberKey']);
  function classify(r,g,b,a=255) {
    if (a<80) return {kind:'empty',confidence:1};
    const distances=palette.map(({name,rgb})=>({name,d:Math.sqrt((r-rgb[0])**2+(g-rgb[1])**2+(b-rgb[2])**2)})).sort((a,b)=>a.d-b.d);
    if(distances[0].d<105) return {kind:distances[0].name,confidence:1-distances[0].d/150};
    if(r>210&&g>210&&b>210)return {kind:'empty',confidence:.4};
    if(r<45&&g<45&&b<45)return {kind:'ground',confidence:.4};
    return {kind:'empty',confidence:0};
  }
  // For generated maps, each logical tile may span N image pixels.
  // A majority vote across the central portion of that cell suppresses JPEG-style noise and blurred edges.
  function parseCanvas(image, pixelsPerTile=1) {
    const cols=Math.floor(image.width/pixelsPerTile),rows=Math.floor(image.height/pixelsPerTile);
    if(cols<8||rows<6||cols>400||rows>80) throw Error(`Level grid must be between 8×6 and 400×80 (found ${cols}×${rows})`);

      }
      grid.push(row);
    }
    if(!objects.some(o=>o.kind==='p1'))warnings.push('No green player-start marker');
    if(!objects.some(o=>o.kind==='exit'))warnings.push('No red level-exit marker');

    return new Promise((resolve,reject)=>{
      const image=new Image();image.onload=()=>{try{resolve(parseCanvas(image,pixelsPerTile))}catch(e){reject(e)}};
      image.onerror=()=>reject(Error('Could not open the PNG image'));
      image.src=url;

  return {colors,classify,parseCanvas,load};
})();

      oval(10,-13,8,7,'#c0df9d');eye(13,-14);

      poly([[-7,-11],[-16,-16+flap*3],[-23,-23],[-19,-13],[-23,-8],[-10,-7]],'#f5a277');

    }else if(name==='glimmermoth'){
      const w=flap*3.5;

      poly([[0,-17],[12,-30+w],[16,-9],[1,-8]],'#c5b6ee');
      poly([[-1,-10],[-11,-5],[-7,-2],[1,-7]],'#91d1dd');
      oval(1,-15,5,10,'#7d6aa9');oval(6,-21,6,6,'#b397d3');eye(9,-22);

      eye(6,-18);oval(10,-14,1.5,1.2,'#dc9bb9');

    }else if(name==='emberkit'){
      poly([[-8,-12],[-19,-22+flap*3],[-16,-11],[-23,-6],[-10,-6]],'#ff996b');
      poly([[-19,-22+flap*3],[-14,-15],[-19,-11]],'#ffe1a0');

    }else{
      oval(0,-12,10,9,'#ed9ec4');oval(3,-15,3,3,'#ffe4cc');
    }
    if(happy||eat){
      ctx.globalAlpha=.9;oval(0,-33+Math.sin(time*8)*1.5,2.1,2.1,pink);ctx.globalAlpha=1;
    }
  }

  function draw(ctx,name,x,y,frame=0,flip=false,playerId=null,pose={}) {
    const index=Math.max(0,kinds.indexOf(name));
    const action=pose.action||'idle',time=pose.time??(frame/3);
    const snack=name==='snack';
    const explorer=playerId!==null;
    const sizes={
      hero:[30,36],springaroo:[29,32],skyling:[31,32],tideling:[30,30],
      cloudwhisp:[28,27],prismtail:[28,30],mossback:[29,27],
      glimmermoth:[26,28],emberkit:[30,31],snack:[23,25]
    };
    const [w,h]=sizes[name]||sizes.hero;
    const running=action==='run',jumping=action==='jump',eating=action==='eat';
    const bounce=running?Math.abs(Math.sin(time*15))*3:
      jumping?-4:eating?2:Math.sin(time*2.8+index)*.9;
    const stretch=jumping?1.12:action==='hurt'?.85:running?1+.055*Math.sin(time*15):1;
    const squash=eating?.9:jumping?.91:running?1-.025*Math.sin(time*15):1;
    const lean=running?Math.sin(time*15)*.08:action==='hurt'?.22:0;
    ctx.save();ctx.translate(Math.round(x),Math.round(y+bounce));
    if(flip)ctx.scale(-1,1);
    ctx.transform(squash,0,lean,stretch,0,0);
    if(!snack)ctx.scale(explorer?.91:.82,explorer?.91:.82);
    ctx.imageSmoothingEnabled=false;
    const spriteFrame=(Math.floor(frame)%frames+frames)%frames;
    if(name==='snack')ctx.drawImage(sheet,index*sw*frames+spriteFrame*sw,0,sw,sh,-w/2,-h,w,h);
    else drawWorldSprite(ctx,name,time,action);
    // Character-specific secondary animation makes motion readable at small scale.
    if(name==='skyling'&&action!=='eat'){
      const flap=Math.sin(time*12)*4;
      ctx.fillStyle='#a7f4e4';
      ctx.fillRect(-w/2-2,-19-flap/2,5,3);
      ctx.fillRect(w/2-3,-17+flap/2,5,3);
    }
    if(name==='glimmermoth'){
      ctx.fillStyle='#fff4be';
      ctx.globalAlpha=.45+.4*Math.abs(Math.sin(time*7));
      ctx.fillRect(-w/2-2,-h+9,3,3);ctx.fillRect(w/2,-h+5,3,3);
      ctx.globalAlpha=1;
    }
    if(name==='springaroo'&&jumping){
      ctx.fillStyle='#fce4aa';ctx.fillRect(-13,-5,5,2);ctx.fillRect(9,-7,4,2);
    }
    if(playerId!==null){
      ctx.fillStyle=playerId===0?'#ffd57f':'#b4a0ff';ctx.fillRect(-5,-8,10,2);
      ctx.fillStyle=playerId===0?'#fff0ba':'#e5ddff';ctx.fillRect(-2,-8,3,2);
    }
    ctx.restore();
  }

  const portraits = Object.fromEntries(kinds.map(name=>{
    const canvas=document.createElement('canvas');canvas.width=56;canvas.height=56;
    const context=canvas.getContext('2d');context.imageSmoothingEnabled=false;
    context.fillStyle='#203c55';context.fillRect(0,0,56,56);
    const i=kinds.indexOf(name);
    context.drawImage(sheet,i*sw*frames,0,sw,sh,2,0,52,56);
    return [name,canvas.toDataURL()];
  }));
  const foodColors={berry:['#ff91c2','#bc427d'],star:['#fff5b5','#d3a755'],nectar:['#a2fff0','#5ba9cd'],honey:['#ffd187','#d17f55'],marshmallow:['#ecdaff','#a197de']};
  const foodIcons=Object.fromEntries(Object.entries(foodColors).map(([name,[light,dark]])=>{
    const canvas=document.createElement('canvas');canvas.width=36;canvas.height=36;
    const c=canvas.getContext('2d');c.imageSmoothingEnabled=false;
    c.fillStyle='#294563';c.fillRect(0,0,36,36);
    c.fillStyle=dark;c.fillRect(7,13,22,18);c.fillStyle=light;c.fillRect(9,11,18,17);
    c.fillStyle='#fffce2';c.fillRect(12,15,5,4);c.fillRect(21,21,3,3);
    if(name==='star'){c.fillStyle='#fff9dc';c.beginPath();for(let j=0;j<10;j++){const a=j*Math.PI/5-Math.PI/2,r=j%2?8:15;c.lineTo(18+Math.cos(a)*r,18+Math.sin(a)*r);}c.closePath();c.fill();}
    if(name==='nectar'){c.fillStyle='#96e7f5';c.fillRect(14,5,8,8);c.fillStyle='#e6fff2';c.fillRect(15,7,5,3);}
    if(name==='honey'){c.fillStyle='#9e6b50';c.fillRect(12,7,12,5);}
    if(name==='berry'){c.fillStyle='#7fd68e';c.fillRect(17,7,5,8);}
    if(name==='marshmallow'){c.fillStyle='#fff7ff';c.fillRect(11,12,13,11);}
    return [name,canvas.toDataURL()];
  }));
  return {draw,portrait:name=>portraits[name]||portraits.hero,foodIcon:name=>foodIcons[name]||foodIcons.berry};
})();

</script>
<script>
window.WW = window.WW || {};
WW.audio = (() => {
  let context;
  const tunes = {
    munch:[[260,340,.08,'sine'],[360,430,.09,'sine']],
    jump:[[420,550,.09,'triangle']], double:[[490,740,.17,'triangle']],
    land:[[160,92,.07,'triangle']], ready:[[510,680,.1,'sine'],[680,930,.18,'sine']],
    checkpoint:[[320,510,.13,'triangle'],[510,760,.22,'sine'],[760,1010,.29,'sine']],
    food:[[500,400,.13,'sine']], orb:[[680,400,.19,'sine']],
    catch:[[480,660,.13,'triangle'],[640,880,.22,'sine'],[920,1160,.29,'sine']],
    miss:[[280,190,.20,'triangle']], gem:[[610,820,.20,'triangle'],[800,1050,.30,'sine'],[1100,1360,.34,'sine']],
    hit:[[240,105,.22,'sawtooth']], sleep:[[350,190,.26,'sine']],
    revive:[[360,680,.23,'triangle'],[540,900,.20,'sine']],
    morph:[[350,800,.22,'triangle'],[600,1120,.27,'sine']],
    recall:[[620,430,.23,'sine'],[460,780,.35,'triangle']],
    win:[[540,720,.22,'triangle'],[670,910,.26,'sine'],[820,1170,.37,'sine']]
  };
  function play(name){
    if(!WW.storage.data.settings.sound)return;
    const Audio=window.AudioContext||window.webkitAudioContext;
    if(!Audio)return;
    context ||=new Audio();
    if(context.state==='suspended')context.resume();
    const notes=tunes[name];if(!notes)return;
    for(const [from,to,length,wave] of notes){
      const oscillator=context.createOscillator(),gain=context.createGain(),start=context.currentTime;
      oscillator.type=wave;oscillator.frequency.setValueAtTime(from,start);
      oscillator.frequency.exponentialRampToValueAtTime(Math.max(10,to),start+length);
      gain.gain.setValueAtTime(.0001,start);
      gain.gain.exponentialRampToValueAtTime(.035/notes.length,start+.016);
      gain.gain.exponentialRampToValueAtTime(.0001,start+length);
      oscillator.connect(gain).connect(context.destination);
      oscillator.start(start);oscillator.stop(start+length+.01);
    }
  }
  return {play};
})();

<script>

// Three authored adventures: geometry and encounter placement are data, not random noise.
// 1 tile = 16 world units. Separate foreground stages create meaningful vertical routes.
WW.worlds = (() => {
  const layouts = {
    'first-forest': {
      width: 144, height: 42, floor: 31,
      heights: [[24,46,30],[46,84,29],[84,112,31],[112,144,30]],
      water: [[98,109]], bridges: [[97,29,7],[105,29,7]],

        [69,21,7],[74,26,8],[83,27,8],[117,26,9]],
      relic: ['springKey',72,12],
      creatures: [
        ['springaroo',17],['glimmermoth',31],['prismtail',46],['springaroo',57],
        ['mossback',85],['emberkit',115],['glimmermoth',130]
      ],

      landmarks: [{x:34,type:'tree'}, {x:69,type:'tree'}, {x:103,type:'pond'}, {x:130,type:'lantern'}]
    },
    'crystal-coast': {
      width: 157, height: 44, floor: 32,
      heights: [[19,42,31],[42,83,32],[83,116,30],[116,157,31]],
      water: [[48,72],[116,139]],
      bridges: [[46,29,8],[54,29,7],[62,29,8],[70,29,6],[114,28,8],[122,28,8],[130,28,8],[138,28,7]],
      ledges: [[24,27,9],[35,25,7],[80,26,9],[91,23,8],[101,26,9],[143,26,9]],

        ['mossback',106],['emberkit',145]
      ],

      stars: [[27,24],[61,33],[94,20],[123,34],[148,22]],
      landmarks: [{x:35,type:'crystal'}, {x:59,type:'reef'}, {x:97,type:'crystal'}, {x:128,type:'reef'}]
    },
    'starfall-summit': {
      width: 166, height: 46, floor: 36,
      heights: [[28,57,34],[57,92,33],[92,121,35],[121,166,34]],
      water: [[71,83]],
      bridges: [[69,30,8],[77,30,8]],
      ledges: [[17,31,8],[28,28,8],[38,25,8],[50,24,8],
        [64,29,7],[87,29,9],[96,26,8],[106,23,8],
        [113,20,8],[122,17,8],[130,14,8],[139,11,7],[147,26,8]],
      relic: ['skyKey',143,2],
      creatures: [
        ['skyling',23],['cloudwhisp',42],['glimmermoth',53],['emberkit',64],
        ['skyling',102],['prismtail',116],['cloudwhisp',133],['mossback',154]
      ],
      checkpoints: [60,118],
      snacks: [10,32,54,92,121,150],
      stars: [[34,23],[55,19],[79,27],[112,20],[137,10]],
      landmarks: [{x:35,type:'observatory'}, {x:75,type:'island'}, {x:114,type:'observatory'}, {x:144,type:'island'}]
    }
  };

  function create(chapter) {
    const data=layouts[chapter.id],width=data.width,height=data.height;
    const floor=Array.from({length:width},(_,x)=>{
      const section=data.heights.find(([from,to])=>x>=from&&x<to);
      return section?section[2]:data.floor;
    });
    const grid=Array.from({length:height},()=>Array(width).fill('empty'));
    const objects=[];
    function stamp(kind,x,y){objects.push({kind,x,y});}
    function platform(x,y,length){
      for(let i=x;i<Math.min(width,x+length);i++)grid[y][i]='platform';
    }
    for(let x=0;x<width;x++){
      const submerged=data.water.some(([a,b])=>x>=a&&x<b);
      for(let y=submerged?floor[x]-2:floor[x];y<height;y++){
        grid[y][x]=submerged&&y<height-1?'water':'ground';
      }
    }
    for(const [x,y,length] of data.bridges)platform(x,y,length);
    for(const [x,y,length] of data.ledges)platform(x,y,length);

    stamp('exit',width-5,floor[width-5]-1);
    stamp(...data.relic);
    for(const [kind,x] of data.creatures){
      const aerial=kind==='skyling'||kind==='cloudwhisp'||kind==='glimmermoth';
      stamp(kind,x,floor[x]-(aerial?4:1));
    }
    for(const x of data.checkpoints)stamp('checkpoint',x,floor[x]-1);
    for(const x of data.snacks)stamp('snack',x,floor[x]-1);
    for(const [x,y] of data.stars)stamp('starShard',x,y);
    return {width,height,grid,objects,chapter,landmarks:data.landmarks,decorSeed:chapter.id,warnings:[]};
  }
  const summary=Object.fromEntries(Object.entries(layouts).map(([id,data])=>
    [id,{width:data.width,height:data.height,relic:data.relic[0],creatures:data.creatures.length}]));
  return {create,summary};
})();

        if(t==='ground'){
          box(ctx,px,py,16,16,tint.soil[0]);box(ctx,px,py+4,16,12,tint.soil[h%2?1:2]);
          if(y===0||map[y-1][x]!=='ground'){
            box(ctx,px,py,16,6,tint.grass[0]);box(ctx,px,py+5,16,2,tint.grass[1]);
            box(ctx,px+2,py-2,3,3,'#a4ed96');box(ctx,px+11,py-1,2,3,'#efffa1');
          }
          // Warm mineral flecks and darker edges give the soil a tactile cut-paper finish.
          if(h%5===0)box(ctx,px+5,py+9,4,2,'#f6ad9b');if(h%7===0)box(ctx,px+12,py+12,2,2,'#c38bd7');
          if(h%23===0){box(ctx,px+8,py+6,3,7,'#7b7bb1');box(ctx,px+9,py+5,1,5,'#b1c9f0');}
        } else if(t==='platform'){
          box(ctx,px,py,16,7,chapter.biome==='summit'?'#7a66b8':'#6659a1');box(ctx,px,py,16,3,chapter.biome==='coast'?'#a9faff':'#b2ffd1');
          box(ctx,px+2,py+7,12,3,'#555583');
          box(ctx,px+5,py+10,6,3,'#7f7dba');
          if(h%3===0){box(ctx,px+5,py-3,2,4,'#aeefcf');box(ctx,px+3,py-5,6,3,'#f4a0cf');}
        } else if(t==='thermal'){
          ctx.globalAlpha=.3+.16*Math.sin(time*3+x*.3);
          box(ctx,px+4+Math.sin(time*4+y)*3,py,7,16,'#7fe1ff');
          box(ctx,px+7+Math.sin(time*6+x)*3,py+4,3,7,'#fff5fc');
          ctx.globalAlpha=1;
        } else if(t==='water'){
          box(ctx,px,py,16,16,chapter.biome==='coast'?(y%2?'#2269b0':'#2689cf'):y%2?'#3b89da':'#3f9fde');
          if(y===0||map[y-1][x]!=='water'){box(ctx,px,py,16,3,'#9be5e1');box(ctx,px+(Math.floor(time*9+x*7)%11),py+1,5,1,'#edf9ce');}
          if(h%6===0)box(ctx,px+5,py+8+Math.sin(time*3+x)*2,2,2,'#8fe4e5');
          if(h%11===0){
            ctx.globalAlpha=.32+.2*Math.sin(time*2.5+x);
            box(ctx,px+2,py+5,9,1,'#c3fff1');box(ctx,px+4,py+11,6,1,'#88dbe6');
            ctx.globalAlpha=1;
          }
        }
      }
      // tiny foreground blossoms, all procedural and repeatable
      for(let x=left;x<right;x++)for(let y=top+1;y<bottom;y++)if(map[y]?.[x]==='ground'&&map[y-1]?.[x]==='empty'&&hash(x,y)%8===1){
        const px=x*TILE+6,py=y*TILE-2;box(ctx,px,py-4,2,5,'#3e8269');box(ctx,px-2,py-6,6,3,'#f39cc3');box(ctx,px,py-7,2,2,'#ffea9f');
      }
    }
    function objective(){
      const goal=goals.find(g=>!shared.keys[g.kind]);
      if(goal){
        const active=players[0],kind=goal.form;
        if(kind&&!active.unlocked[kind]){
          const creature=animals.filter(a=>a.alive&&a.kind===kind)
            .sort((a,b)=>distance(a,active)-distance(b,active))[0];
          if(creature)return {
            x:creature.x,y:creature.y,goal:kind,
            name:'BEFRIEND '+titles[kind].toUpperCase(),
            hint:'F: leave '+FOOD[FORM[kind].favorite].name+' · wait for DISTRACTED · G: orb'
          };
        }
        const gem=items.find(item=>item.kind===goal.kind);
        return {x:gem.x,y:gem.y,name:goal.name.toUpperCase(),goal:goal.kind,
          hint:active.form!==kind?'Q: choose '+titles[kind]+' · T: transform · '+goal.hint:goal.hint};
      }
      const gate=items.find(item=>item.kind==='exit');
      return {x:gate.x,y:gate.y,name:'RETURN TO THE GATE',hint:'Your light is found · carry it to the gate',goal:'exit'};
    }
    function trailGuide(ctx,now){
      const current=objective(),p=players[0],delta=current.x-p.x;
      const miles=Math.round(Math.abs(delta)/TILE);
      const direction=Math.abs(delta)<TILE*2?'HERE':delta>0?'RIGHT':'LEFT';
      const goalLabel=current.name.length>30?current.name.slice(0,28)+'…':current.name;
      // A two-line compass replaces the tiny, long-form debug string.
      box(ctx,9,H-34,311,26,'#102b3ce7');
      box(ctx,9,H-34,3,26,'#e7cb89');
      ctx.textAlign='left';ctx.fillStyle='#f5db9d';ctx.font='bold 9px sans-serif';
      ctx.fillText(`✦ ${goalLabel} · ${direction} ${miles} TILES`,16,H-23,295);
      ctx.fillStyle='#d4e9df';ctx.font='8px sans-serif';
      ctx.fillText(current.hint,16,H-12,292);
      // A compact trail atlas communicates overall chapter scale and explored distance.
      const left=W-147,top=H-34,bar=119;
      box(ctx,left,top,138,26,'#102b3ce7');
      ctx.fillStyle='#e5d9ad';ctx.font='bold 8px sans-serif';
      ctx.fillText('TRAIL',left+8,top+9);
      box(ctx,left+8,top+16,bar,3,'#49636b');
      box(ctx,left+8,top+16,bar*clamp(p.x/width,0,1),3,'#a6dbbd');
      for(const gem of items.filter(item=>goalKinds.has(item.kind))){
        const gx=left+8+bar*gem.x/width;
        box(ctx,gx-1,top+13,3,9,shared.keys[gem.kind]?'#f4d18c':'#7797a0');
      }
      for(const player of players){
        const px=left+8+bar*clamp(player.x/width,0,1);
        box(ctx,px-2,top+13,5,9,player.id===0?'#ffefd2':'#c9bdff');
      }
      // Offscreen arrows anchor navigation without moving the camera or blocking play.
      if(Math.abs(delta)>W*.42){
        const right=delta>0,x=right?W-19:19,y=H*.51;
        ctx.globalAlpha=.6+.4*Math.sin(now*3.4);
        ctx.fillStyle='#f5da9d';ctx.beginPath();
        ctx.moveTo(x+(right?7:-7),y);
        ctx.lineTo(x+(right?-4:4),y-7);
        ctx.lineTo(x+(right?-4:4),y+7);
        ctx.closePath();ctx.fill();
        ctx.globalAlpha=1;
      }
    }
    function render(ctx,now){
      ctx.setTransform(3,0,0,3,0,0);
      background(ctx,now);
      ctx.save();ctx.translate(Math.round((Math.random()-.5)*shake),Math.round((Math.random()-.5)*shake));ctx.translate(-Math.round(cameraX),-Math.round(cameraY));
      sceneryBack(ctx,now);drawLandmarks(ctx,now);terrain(ctx,now);groundDetails(ctx,now);
      for(const sign of chapter.signs||[]){
        const x=sign.x*TILE;if(x<cameraX-65||x>cameraX+W+65)continue;
        const ground=Array.from({length:level.height},(_,y)=>y).find(y=>map[y]?.[sign.x]==='ground');
        if(ground===undefined)continue;
        const y=ground*TILE;
        box(ctx,x-1,y-57,4,59,'#57476f');box(ctx,x-23,y-59,48,17,chapter.biome==='coast'?'#2a82a0':'#654a90');
        box(ctx,x-19,y-56,40,3,'#d4f5dd');
        ctx.font='bold 6px sans-serif';ctx.fillStyle='#fff4d1';ctx.textAlign='center';
        ctx.fillText(sign.title.slice(0,16),x,y-48);ctx.textAlign='left';
        box(ctx,x-2,y-37,8,6,'#ffd6a8');
      }
      for(const c of challenges){
        if(c.type!=='sprint')continue;
        for(const [x,word] of [[c.start*TILE,'START'],[c.finish*TILE,'FINISH']]){
          const top=players[0].y-61;
          if(x<cameraX-50||x>cameraX+W+50)continue;
          box(ctx,x-4,top,8,61,c.completed?'#85d5ac':'#9b7ae8');
          box(ctx,x-16,top-7,33,12,c.completed?'#4eaa94':'#6b4eab');
          ctx.fillStyle='#fff2c6';ctx.font='bold 7px sans-serif';ctx.fillText(word,x-12,top+1);
        }
      }
      items.forEach(it=>{if(it.used&&it.kind!=='checkpoint')return;const bob=Math.sin(now*3+it.x)*2;
        if(it.kind==='snack')WW.art.draw(ctx,'snack',it.x,it.y+8+bob,Math.floor(now*3)%4);
        if(it.kind==='starShard'){
          ctx.save();ctx.translate(it.x,it.y+bob);ctx.rotate(Math.sin(now*3+it.x)*.22);
          ctx.fillStyle='#fff8bd';ctx.beginPath();for(let i=0;i<10;i++){
            const a=i*Math.PI/5-Math.PI/2,r=i%2?3:8;
            ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
          }ctx.closePath();ctx.fill();box(ctx,-1,-3,2,4,'#ffffff');ctx.restore();
        }
        if(goalKinds.has(it.kind)){
          const tint=({springKey:'#ff94d5',skyKey:'#f5dfa9',diveKey:'#91f5ff',prismKey:'#ffaf68',mossKey:'#a7f8a0',cloudKey:'#d9bfff',emberKey:'#ff8d6d'})[it.kind]||'#ffe79f';
          ctx.save();ctx.translate(it.x,it.y+bob);ctx.rotate(now*.65);
          box(ctx,-5,-5,10,10,tint);box(ctx,-2,-10,4,5,'#ffffff');box(ctx,6,-2,5,4,tint);box(ctx,-9,-1,4,3,tint);ctx.restore();
          ctx.globalAlpha=.65+.3*Math.sin(now*5);box(ctx,it.x-2,it.y-13+bob,4,2,'#fffcef');box(ctx,it.x+12,it.y+bob,3,3,tint);ctx.globalAlpha=1;
          ctx.fillStyle='#fff4dd';ctx.font='bold 8px sans-serif';ctx.fillText('LIGHT',it.x-12,it.y-19+bob);
        }
        if(it.kind==='exit'){
          box(ctx,it.x-12,it.y-28,24,36,'#725771');box(ctx,it.x-8,it.y-25,16,31,goals.every(g=>shared.keys[g.kind])?'#6befc6':'#423c6b');
          box(ctx,it.x-5,it.y-20,10,14,'#af9abb');box(ctx,it.x-3,it.y-19,6,10,'#433f7d');box(ctx,it.x+4,it.y-9,2,2,'#ffdc80');
        }
        if(it.kind==='checkpoint') {
          box(ctx,it.x-2,it.y-22,3,27,it.used?'#bde5af':'#765968');
          box(ctx,it.x+1,it.y-22,14,9,it.used?'#f5dfa1':'#9bf6c9');
          if(it.used){
            ctx.globalAlpha=.3+.2*Math.sin(now*3);
            ctx.fillStyle='#fff3aa';ctx.beginPath();ctx.arc(it.x+7,it.y-18,12,0,Math.PI*2);ctx.fill();
            ctx.globalAlpha=1;
          }
        }
      });
      lures.forEach(lure=>{
        const shimmer=.6+.2*Math.sin(now*4+lure.x);
        ctx.save();ctx.translate(lure.x,lure.y-3);
        ctx.globalAlpha=shimmer*.35;ctx.fillStyle=FOOD[lure.food].color;
        ctx.beginPath();ctx.ellipse(0,0,17,5,0,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=1;
        ctx.fillStyle='#213b43';ctx.fillRect(-4,-5,8,7);
        ctx.fillStyle=FOOD[lure.food].color;ctx.fillRect(-3,-7,6,7);
        ctx.fillStyle='#fff7db';ctx.fillRect(-2,-6,2,2);
        ctx.fillStyle='#9bdc9e';ctx.fillRect(1,-9,4,2);
        for(let n=0;n<2;n++){
          const pulse=(now*.9+n*.5)%1;
          ctx.globalAlpha=(1-pulse)*.45;
          ctx.strokeStyle=FOOD[lure.food].color;ctx.lineWidth=1;
          ctx.beginPath();ctx.ellipse(0,-4,8+pulse*24,3+pulse*7,0,0,Math.PI*2);ctx.stroke();
        }
        ctx.restore();
      });
      animals.forEach(a=>{
        if(!a.alive)return;
        const near=players.some(p=>!p.sleep&&Math.abs(p.x-a.x)<105&&Math.abs(p.y-a.y)<105);
        const species=CREATURE[a.kind],ready=a.distractedUntil>clock;
        // Feet and shadows visually connect wandering creatures to the ground.
        ctx.globalAlpha=.17;ctx.fillStyle='#102e3a';
        ctx.beginPath();ctx.ellipse(a.x,a.y+1,11,3,0,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=1;
        WW.art.draw(ctx,a.kind,a.x,a.y,Math.floor(a.frame)%6,a.dir<0,null,{
          action:a.eating>0?'eat':ready?'happy':a.windup?'alert':'idle',time:a.phase
        });
        if(a.eating>0||ready){
          ctx.fillStyle='#ffeab9';ctx.font='bold 9px sans-serif';
          ctx.fillText('♥',a.x+9,a.y-23-2*Math.sin(now*5));
        }
        if(a.windup&&!a.eating){ctx.fillStyle='#ffd6a2';ctx.font='bold 11px sans-serif';ctx.fillText('!',a.x-3,a.y-32);}
        if(!near)return;
        if(species.capturable){
          box(ctx,a.x-19,a.y-39,38,4,'#183a46');
          box(ctx,a.x-18,a.y-38,36*a.trust/TRUST_TARGET,2,ready?'#f7dc94':'#b0e2b5');
          ctx.fillStyle=ready?'#ffe9b3':'#f4f2df';ctx.font='bold 8px sans-serif';
          ctx.fillText(ready?'♥ DISTRACTED · G':titles[a.kind],a.x-28,a.y-45);
          if(!ready&&a.trust<100){
            ctx.fillStyle='#a9d9c5';ctx.font='7px sans-serif';
            ctx.fillText(FOOD[species.favorite].name+' ♥',a.x-25,a.y-31);
          }
        }else if(a.kind==='emberkit'){
          ctx.fillStyle='#ffd6a2';ctx.font='bold 8px sans-serif';
          ctx.fillText(a.eating?'♥ SNACK TIME':'! TERRITORIAL',a.x-27,a.y-34);
        }
      });
      captures.forEach(orb=>{
        const t=orb.age/1.05,spin=t*Math.PI*5;
        ctx.save();ctx.translate(orb.x,orb.y);
        ctx.globalAlpha=Math.max(0,1-t);ctx.strokeStyle=orb.color;
        ctx.lineWidth=2.5*(1-t)+.4;
        ctx.beginPath();ctx.arc(0,0,5+25*Math.sin(Math.min(1,t)*Math.PI),spin,spin+Math.PI*1.7);ctx.stroke();
        for(let j=0;j<7;j++){
          const angle=spin+j*Math.PI*2/7;
          const radius=7+22*t;
          ctx.fillStyle=j%2?'#fff3d4':orb.color;
          ctx.fillRect(Math.cos(angle)*radius-2,Math.sin(angle)*radius-2,3,3);
        }
        if(t<.55){
          ctx.globalAlpha=(.55-t)*1.3;
          ctx.save();ctx.scale(1-t*.9,1-t*.9);
          WW.art.draw(ctx,orb.kind,0,13,0,false);
          ctx.restore();
        }
        ctx.globalAlpha=1;
        ctx.fillStyle='#fff4df';ctx.beginPath();ctx.arc(0,0,3+3*(1-t),0,Math.PI*2);ctx.fill();
        ctx.restore();
      });
      projectiles.forEach(pr=>{
        const color=pr.kind==='food'?FOOD[pr.food].color:({orb:'#d8bcff',feather:'#f7eec7',bubble:'#9fe4fa',thorn:'#f5ae7a',gust:'#c4f4ff',spark:'#ffcbb9',seed:'#b4eb98',starlight:'#edc9ff',ember:'#ffb675'}[pr.kind]||'#ffffff');
        box(ctx,pr.x-4,pr.y-4,8,8,'#273e55');box(ctx,pr.x-3,pr.y-3,6,6,color);if(pr.kind==='orb'||pr.kind==='food')box(ctx,pr.x-1,pr.y-2,2,2,'#ffffff');
      });
      players.forEach(p=>{
        if(p.sleep){
          WW.art.draw(ctx,'hero',p.x,p.y+8,1,p.face<0,p.id,{action:'sleep',time:now});
          ctx.font='bold 10px sans-serif';ctx.fillStyle='#f9fbff';
          ctx.fillText('z',p.x+10,p.y-24-Math.sin(now*2)*3);ctx.fillText('Z',p.x+19,p.y-33-Math.sin(now*2+.8)*3);
        }else{
          if(p.form){ctx.save();ctx.globalAlpha=.19+.09*Math.sin(now*5);ctx.fillStyle=FORM[p.form].color;ctx.beginPath();ctx.ellipse(p.x,p.y-13,18,23,0,0,Math.PI*2);ctx.fill();ctx.restore();}
          if(p.invincible<=0||Math.floor(now*15)%2===0)
            WW.art.draw(ctx,p.form||'hero',p.x,p.y,Math.floor(p.frame)%6,p.face<0,p.id,{
              action:p.hurt>0?'hurt':!p.grounded?'jump':Math.abs(p.vx)>0.25?'run':'idle',time:now
            });
        }
        // Colored player markers remain clear even while transformed.
        box(ctx,p.x-8,p.y-43,16,3,'#152e42');box(ctx,p.x-7,p.y-42,14,2,p.id===0?'#ffd782':'#91d2ff');
        ctx.font='bold 8px sans-serif';ctx.fillStyle='#102b41';ctx.fillText(String(p.id+1),p.x-2,p.y-46);
      });
      effects.forEach(e=>{
        // A larger faint halo lets spell effects read as light, not confetti.
        ctx.globalAlpha=Math.min(.22,e.time*.3);
        box(ctx,e.x-3,e.y-3,9,9,e.color);
        ctx.globalAlpha=1;
        box(ctx,e.x,e.y,3,3,e.color);
      });ctx.restore();
      // Screen-space light and vignette are atmospheric only: no physics or map semantics change.
      const sunlight=ctx.createRadialGradient(W*.46,H*.12,5,W*.46,H*.12,W*.85);
      sunlight.addColorStop(0,chapter.biome==='summit'?'#f6c9ff13':'#fff4c51c');
      sunlight.addColorStop(.6,'#b8f9dd05');sunlight.addColorStop(1,'#08152652');
      ctx.fillStyle=sunlight;ctx.fillRect(0,0,W,H);
      const edge=ctx.createLinearGradient(0,0,0,H);
      edge.addColorStop(0,'#0c1c2e30');edge.addColorStop(.25,'#0c1c2e00');
      edge.addColorStop(.8,'#0c1c2e00');edge.addColorStop(1,'#0b1d3138');
      ctx.fillStyle=edge;ctx.fillRect(0,0,W,H);
      const race=challenges.find(c=>c.type==='sprint'&&c.active);
      if(race){box(ctx,140,32,200,20,'#203252d5');ctx.font='bold 12px sans-serif';ctx.fillStyle='#ffebb9';ctx.fillText(`CRYSTAL DASH: ${race.time.toFixed(1)}s`,164,46);}
      trailGuide(ctx,now);
    }
    hud.hidden=false;callout.hidden=true;say(`${chapter.name} · ${chapter.intro}`,4200);
    return {update,render,recallParty,recallCheckpoint(){recallParty(shared.checkpoint);},stop(){hud.hidden=true;callout.hidden=true;message.classList.remove('show');},get state(){return {chapter,goals,challenges,players,shared,animals,items,projectiles,lures,captures,cameraX,cameraY,objective:objective(),physics:PHYSICS,jumpHeight}}};
  }
  return {start};
})();

</script>
<script>
window.WW = window.WW || {};
WW.main = (() => {
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
  const menu=document.getElementById('menu');const hud=document.getElementById('hud');
  let game=null,last=0,paused=true,screen='home',cancelCalibration=null,customMap=null,pixelsPerTile=1,menuPadLatch='',currentChapterIndex=0;
  const panel=(content)=>{menu.hidden=false;menu.innerHTML=`<section class="panel ${screen==='home'?'panel-home':''}">${content}</section>`;menu.querySelector('button')?.focus({preventScroll:true});};
  const button=(id,label,kind='secondary')=>`<button class="${kind}" data-action="${id}">${label}</button>`;
  function home(){
    if(game){game.stop();game=null;}paused=true;screen='home';cancelCalibration?.();cancelCalibration=null;
    const finished=WW.storage.data.progress.chapters||{};
    const nextUnfinished=WW.chapters.findIndex(chapter=>!Object.hasOwn(finished,chapter.id));
    currentChapterIndex=nextUnfinished<0?0:nextUnfinished;
    const completed=WW.chapters.filter(chapter=>Object.hasOwn(finished,chapter.id)).length;
    const playLabel=currentChapterIndex?'▶ CONTINUE: '+WW.chapters[currentChapterIndex].name:'▶ PLAY FIRST FOREST';
    const portrait=type=>'<img src="'+WW.art.portrait(type)+'" alt="'+WW.catalog.creatures[type].name+'">';
    panel(`
    <div class="home-layout">
      <div class="home-copy">

        <h1>WONDER<span>WOOD</span></h1>
        <div class="home-rule">A LITTLE MAGIC GOES A LONG WAY</div>
        <h2>Every creature has a story.<br>Every forest has a secret.</h2>
        <p>Wander through moonlit meadows, luminous reefs and starlit peaks. Make friends with magical creatures, borrow their extraordinary powers, and find the lost gems together.</p>
        <div class="buttons">${button('play',playLabel,'primary')}${button('chapters','✦ CHOOSE A LEVEL')}</div>
        <div class="home-note">3 unique powers &nbsp; · &nbsp; 8 living creatures &nbsp; · &nbsp; ${completed}/3 completed</div>
      </div>
      <div class="home-art" aria-label="Four magical creatures beneath a glowing moon" role="img">
        <div class="art-stars"></div><div class="art-orbit"></div>
        ${['springaroo','skyling','tideling','emberkit'].map(t=>'<div class="art-portrait">'+portrait(t)+'</div>').join('')}
        <div class="art-caption">THE WOODS ARE WAKING</div>
      </div>
    </div>
    <div class="home-bottom"><span class="hint">${customMap?'Custom map ready.':'Your next adventure begins here.'} &nbsp; · &nbsp; ${WW.input.pads().length} controller(s) connected</span>
      <div class="buttons">${button('journal','Creature journal')}${button('settings','Settings')}${button('calibrate','Controller setup')}${button('level','Load PNG map')}</div>
    </div>
    <details class="control-guide"><summary>View keyboard controls</summary>
      <div class="instructions"><b>Player 1:</b> A / D move · W jump · F food · E change food · G catch orb · Q choose form · T transform · R revive · C camp<br>
      <b>Player 2:</b> J / L move · I jump · O food · M change food · P catch orb · H choose form · U transform · Y revive · N camp<br>
      <b>Menus:</b> Arrow keys + Enter · Escape pauses · Gems collect on contact</div>
    </details>`);
  }
  function chapters(){
    screen='chapters';
    const cards=WW.chapters.map((c,i)=>`<div class="chapter-card ${c.biome}"><div class="chapter-number">CHAPTER ${i+1} · ${c.difficulty}</div><div class="chapter-illustration"><img src="${WW.art.portrait(['springaroo','tideling','cloudwhisp'][i])}" alt=""></div><h2>${c.name}</h2><p>${c.tagline}</p><div class="chapter-stats">1 light · ${WW.worlds.summary[c.id].width} tiles · ${Object.hasOwn(WW.storage.data.progress.chapters||{},c.id)?'✓ Completed':'New adventure'}</div>${button('stage-'+i,'Explore '+c.name,i===currentChapterIndex?'primary':'secondary')}</div>`).join('');
    panel(`<div class="kicker">The Wonderwood Atlas</div><h1>CHOOSE YOUR TRAIL</h1><p>Every chapter has a new landscape, different puzzles and magical neighbors. Play in any order.</p><div class="chapter-grid">${cards}</div><div class="buttons">${button('home','Back')}</div>`);
  }
  async function play(index=currentChapterIndex) {
    currentChapterIndex=index;
    const chapter=customMap?null:WW.chapters[index];
    if(game){game.stop();game=null;}
    paused=true;screen='loading';
    panel('<div class="kicker">Unfolding the forest map</div><h2>Loading adventure…</h2>');
    try{
      const level=customMap?await WW.levels.load(customMap,pixelsPerTile):WW.worlds.create(chapter);
      level.chapter=chapter;
      if(level.warnings.some(w=>w.startsWith('No ')))throw Error(level.warnings.join(' · '));
      WW.input.reset();game=WW.games.animals.start(level);menu.hidden=true;paused=false;screen='playing';last=0;
      if(level.warnings.length)game && console.warn('Level warnings:',level.warnings);
      if(document.activeElement instanceof HTMLElement)document.activeElement.blur();
    }catch(error){screen='error';panel(`<h2>Couldn't read this level</h2><p class="warning" id="error"></p><div class="buttons">${button('home','Back to menu')}</div>`);document.getElementById('error').textContent=error.message;}
  }
  function settings(){
    screen='settings';const settings=WW.storage.data.settings;
    panel(`<div class="kicker">Wonderwood Arcade</div><h2>Game settings</h2>
      <p>Controls and progress are stored in this browser. Export a save to keep a backup when you move the HTML file.</p>
      <div class="row"><label for="players">Players</label><select id="players"><option value="1" ${settings.players===1?'selected':''}>1 player</option><option value="2" ${settings.players===2?'selected':''}>2 players</option></select></div>
      <label class="toggle"><input id="rumble" type="checkbox" ${settings.rumble?'checked':''}> Controller vibration (if supported)</label><label class="toggle"><input id="sound" type="checkbox" ${settings.sound?'checked':''}> Magical sound effects</label>
      <div class="buttons">${button('save-settings','Save settings','primary')}${button('export','Export save')}${button('import','Import save')}${button('home','Back')}</div>
      <input id="save-file" type="file" accept="application/json,.json" hidden>
      <div class="instructions">Controller vibration support varies by gamepad, Linux driver, and Firefox version.</div>`);
    document.getElementById('save-file').addEventListener('change',async(e)=>{
      const file=e.target.files[0];if(!file)return;
      try{await WW.storage.importSave(file);settings();}
      catch(err){alert(err.message);}
    });
  }
  function calibration(){
    screen='calibration';const pads=WW.input.pads();if(!pads.length){panel(`<div class="kicker">Controller setup</div><h2>No gamepad detected</h2><p>Connect a USB controller, then press any button on it while Firefox is focused. The browser only exposes gamepads after interaction.</p><div class="buttons">${button('calibrate','Try again','primary')}${button('home','Back')}</div>`);return;}
    const p=pads[0];
    panel(`<div class="kicker">Controller setup · ${p.index+1}</div><h2>Press the requested control</h2><p id="calibration-step"></p><p class="hint">Release each control before the next step. Saves automatically by controller name.</p><div class="buttons">${button('home','Cancel')}</div>`);
    const display={left:'MOVE LEFT',right:'MOVE RIGHT',down:'DIVE DOWN',jump:'JUMP / FLY',snack:'THROW SELECTED FOOD',orb:'MAGIC CATCH ORB',cycle:'CHOOSE ANIMAL',transform:'SWITCH FORM',revive:'WAKE / REVIVE',foodCycle:'CHANGE FOOD',recall:'RETURN TO CAMP'};
    cancelCalibration=WW.input.calibrate(p.index,(step,actions)=>{
      const element=document.getElementById('calibration-step');
      if(element)element.textContent=`${step+1} / ${actions.length} — ${display[actions[step]]}`;
    },()=>{cancelCalibration=null;WW.input.rumble(0,.6,220);panel(`<h2>Controller saved!</h2><p>The mapping will load automatically whenever this controller connects.</p><div class="buttons">${button('home','Back to menu','primary')}</div>`);});
  }
  function level(){
    screen='level';panel(`<div class="kicker">For level creators · AI-assisted maps</div><h2>Load your own PNG map</h2>
      <p>Use the palette from README.md. One pixel is one tile by default; for an AI-generated image with large color blocks, enter the number of image pixels per tile. The parser uses center sampling and approximate colors.</p>
      <div class="row"><label>PNG <input type="file" id="level-file" accept="image/png"></label><label>Pixels per tile <input id="tile-size" type="number" min="1" max="64" value="1" style="width:70px"></label></div>
      <p class="hint">A green start marker and a red exit marker are required. Unknown colors become empty terrain and are reported in the console.</p>
      <div class="buttons">${button('load-level','Use this level','primary')}${button('reset-level','Use built-in level')}${button('home','Back')}</div>`);
  }
  function journal(){
    screen='journal';
    const species=Object.entries(WW.catalog.creatures).map(([kind,c])=> {
      const form=WW.catalog.forms[kind];
      const role=form?'Companion · '+form.power:'Wildlife · '+c.role;
      return '<div class="journal-card"><img src="'+WW.art.portrait(kind)+'" alt=""><div><b>'+c.name+
        '</b><small>'+role+'<br>Favorite: '+WW.catalog.foods[c.favorite].name+
        (form?' · Befriend to unlock its power':' · Cannot transform')+'</small></div></div>';
    }).join('');
    const foods=Object.entries(WW.catalog.foods).map(([kind,c])=>
      '<span class="food-guide"><img src="'+WW.art.foodIcon(kind)+'" alt="">'+c.name+'</span>').join('');
    panel('<div class="kicker">Wonderwood field notes</div><h2>Creatures have lives of their own</h2>'+
      '<p>Leave fruit on the ground. Watch creatures approach and eat. Two favorite treats (or three others) will distract a companion for 12 seconds; while it is distracted, throw an orb to befriend it. That power remains yours for the chapter.</p>'+
      '<div class="journal-grid">'+species+'</div><h3>Picnic basket</h3><div class="guide-foods">'+foods+'</div>'+
      '<p>Not every animal is a transformation. Some run away, some wander, some guard their territory. Only Springaroo, Tidefox and Moonwing share movement powers.</p>'+
      '<div class="buttons">'+button('home','Back to menu','primary')+'</div>');
  }
  function pause(){if(!game||screen!=='playing')return;paused=true;screen='paused';panel(`<div class="kicker">Adventure on hold</div><h2>Paused</h2><p>Snack time? Your forest friends will still be here.</p><div class="buttons">${button('resume','Resume','primary')}${button('camp','Return everyone to camp')}${button('checkpoint','Warp to last checkpoint')}${button('restart','Restart level')}${button('home','Main menu')}</div>`);}
  function win(wins,shards=0,total=0){
    paused=true;screen='won';const chapter=customMap?null:WW.chapters[currentChapterIndex];
    const next=chapter&&currentChapterIndex<WW.chapters.length-1;
    panel(`<div class="kicker">Chapter complete · ${chapter?.name||'Custom adventure'}</div><h1>YOU DID IT!</h1><h2>The ancient gate has awakened!</h2><p>You recovered the chapter's light and found ${shards}/${total} hidden star shards. The forest remembers your teamwork. Completed adventures: ${wins}.</p><div class="buttons">${next?button('next','▶ Next: '+WW.chapters[currentChapterIndex+1].name,'primary'):''}${button('restart','Replay chapter')}${button('chapters','Chapter select')}${button('home','Arcade menu')}</div>`);
  }
  menu.addEventListener('click',async e=>{
    const id=e.target.closest('button')?.dataset.action;
    if(!id)return;
    if(id==='play'||id==='restart')await play();
    if(id==='chapters')chapters();
    if(id==='next'){customMap=null;await play(currentChapterIndex+1);}
    if(id.startsWith('stage-')){customMap=null;await play(Number(id.slice(6)));}
    if(id==='home')home();
    if(id==='settings')settings();
    if(id==='journal')journal();
    if(id==='calibrate')calibration();
    if(id==='level')level();
    if(id==='camp'&&screen==='paused'){game.recallParty();paused=false;screen='playing';menu.hidden=true;last=0;}
    if(id==='checkpoint'&&screen==='paused'){game.recallCheckpoint();paused=false;screen='playing';menu.hidden=true;last=0;}
    if(id==='resume'&&screen==='paused'){paused=false;screen='playing';menu.hidden=true;WW.input.reset();last=0;}
    if(id==='save-settings'){WW.storage.data.settings.players=Number(document.getElementById('players').value);WW.storage.data.settings.rumble=document.getElementById('rumble').checked;WW.storage.data.settings.sound=document.getElementById('sound').checked;WW.storage.save();home();}
    if(id==='export')WW.storage.exportSave();
    if(id==='import')document.getElementById('save-file').click();
    if(id==='reset-level'){customMap=null;pixelsPerTile=1;home();}
    if(id==='load-level'){
      const file=document.getElementById('level-file').files[0];if(!file){alert('Select a PNG file first.');return;}
      const size=Number(document.getElementById('tile-size').value);
      if(!Number.isInteger(size)||size<1||size>64){alert('Pixels per tile must be 1–64.');return;}
      customMap=URL.createObjectURL(file);pixelsPerTile=size;await play();
    }
  });
  addEventListener('keydown',e=>{
    if(e.code==='Escape'){
      if(screen==='playing'){e.preventDefault();pause();}
      else if(screen==='paused'){e.preventDefault();paused=false;screen='playing';menu.hidden=true;WW.input.reset();last=0;}
      else if(!['home','loading','won'].includes(screen)){e.preventDefault();home();}
      return;
    }
    if(menu.hidden||!['ArrowDown','ArrowRight','ArrowUp','ArrowLeft','KeyW','KeyS'].includes(e.code))return;
    if(e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) return;
    const buttons=[...menu.querySelectorAll('button:not([disabled])')];
    if(!buttons.length)return;
    e.preventDefault();const index=buttons.indexOf(document.activeElement);
    const forward=['ArrowDown','ArrowRight','KeyS'].includes(e.code);
    buttons[(index+(forward?1:-1)+buttons.length)%buttons.length].focus();
  });
  function pollMenuGamepad(){
    if(menu.hidden || screen==='calibration'){menuPadLatch='';return;}
    const pad=WW.input.pads()[0];if(!pad){menuPadLatch='';return;}
    const left=pad.buttons[14]?.pressed||pad.axes[0]<-.55;
    const right=pad.buttons[15]?.pressed||pad.axes[0]>.55;
    const up=pad.buttons[12]?.pressed||pad.axes[1]<-.55;
    const down=pad.buttons[13]?.pressed||pad.axes[1]>.55;
    const confirm=pad.buttons[0]?.pressed;
    const value=confirm?'confirm':left||up?'previous':right||down?'next':'';
    if(value&&value!==menuPadLatch){
      const buttons=[...menu.querySelectorAll('button:not([disabled])')];
      if(value==='confirm')document.activeElement?.click?.();
      else if(buttons.length){const selected=buttons.indexOf(document.activeElement);
        buttons[(selected+(value==='next'?1:-1)+buttons.length)%buttons.length].focus({preventScroll:true});}
    }
    menuPadLatch=value;
  }
  function idle(now){
    ctx.setTransform(3,0,0,3,0,0);
    const t=now*.001;const sky=ctx.createLinearGradient(0,0,0,270);sky.addColorStop(0,'#73b6cf');sky.addColorStop(1,'#dbedcf');ctx.fillStyle=sky;ctx.fillRect(0,0,480,270);
    for(let layer=0;layer<3;layer++){
      const h=135+layer*38;ctx.fillStyle=['#aacfc1','#77b0a9','#427e7a'][layer];ctx.beginPath();ctx.moveTo(0,270);
      for(let x=0;x<500;x+=16)ctx.lineTo(x,h+Math.sin(x*.023+layer+t*.06)*14+Math.sin(x*.09)*6);ctx.lineTo(480,270);ctx.fill();
    }
    for(let i=0;i<25;i++){const x=i*24+(Math.sin(i*2)*8);ctx.fillStyle='#285963';ctx.fillRect(x,201,5,60);ctx.fillStyle=i%2?'#478b79':'#57987b';ctx.fillRect(x-9,178+Math.sin(i)*12,24,28);}
    ctx.fillStyle='#89bd71';ctx.fillRect(0,244,480,26);
    for(let x=0;x<480;x+=16){ctx.fillStyle='#528b69';ctx.fillRect(x,243,16,3);ctx.fillStyle='#a0d181';ctx.fillRect(x+4,240,3,4);}
    WW.art.draw(ctx,'springaroo',85,244,Math.floor(t*3)%4);WW.art.draw(ctx,'skyling',375,183+Math.sin(t*2)*5,Math.floor(t*6)%4);WW.art.draw(ctx,'tideling',135,244,Math.floor(t*3)%4);WW.art.draw(ctx,'hero',235,242,Math.floor(t*2)%4);
  }
  function frame(now){const dt=last?Math.min((now-last)/1000,.05):0;last=now;if(game){if(!paused)game.update(dt);game.render(ctx,now/1000);}else idle(now);
    pollMenuGamepad();requestAnimationFrame(frame);}
  WW.storage.load();WW.input.syncAssignments();home();requestAnimationFrame(frame);
  return {home,pause,win,play,get game(){return game}};
})();

</script>
</body>
</html>
