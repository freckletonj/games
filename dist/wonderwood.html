  <script>
window.WW = window.WW || {};
WW.storage = (() => {
  const KEY = 'wonderwood-save-v1';
  const initial = () => ({ settings: { rumble: true, sound: true, players: 2 }, profiles: {}, progress: { wins: 0 } });
  let data = initial();
  function load() {
    const stored = localStorage.getItem(KEY);
    if (stored) {
      const parsed = JSON.parse(stored);
      data = { ...initial(), ...parsed, settings: { ...initial().settings, ...parsed.settings } };
    }
    return data;
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(data)); }
  function exportSave() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'wonderwood-save.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  async function importSave(file) {
    const incoming = JSON.parse(await file.text());
    if (!incoming || typeof incoming !== 'object' || !incoming.settings || !incoming.profiles) throw Error('Not a Wonderwood save file');
    data = { ...initial(), ...incoming, settings: { ...initial().settings, ...incoming.settings } }; save();
  }
  return { load, save, exportSave, importSave, get data() { return data; } };
})();

</script>
<script>
window.WW = window.WW || {};
WW.input = (() => {
  const actions = ['left','right','down','jump','snack','orb','cycle','transform','revive','foodCycle','recall'];
  const defaults = { left:[{type:'axis',index:0,sign:-1},{type:'button',index:14}],right:[{type:'axis',index:0,sign:1},{type:'button',index:15}],down:[{type:'axis',index:1,sign:1},{type:'button',index:13}],jump:[{type:'button',index:0}],snack:[{type:'button',index:1}],orb:[{type:'button',index:2}],cycle:[{type:'button',index:5}],transform:[{type:'button',index:3}],revive:[{type:'button',index:4}],foodCycle:[{type:'button',index:7}],recall:[{type:'button',index:8}] };
  const keyMaps = [ { left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],down:['KeyS','ArrowDown'],jump:['KeyW','Space','ArrowUp'],snack:['KeyF'],orb:['KeyG'],cycle:['KeyQ'],transform:['KeyT'],revive:['KeyR'],foodCycle:['KeyE'],recall:['KeyC'] }, { left:['KeyJ'],right:['KeyL'],down:['KeyK'],jump:['KeyI'],snack:['KeyO'],orb:['KeyP'],cycle:['KeyH'],transform:['KeyU'],revive:['KeyY'],foodCycle:['KeyM'],recall:['KeyN'] } ];
  const keys = new Set(); const prev = [new Set(), new Set()]; const assigned = new Map();
  addEventListener('keydown', e => {if (/^(Arrow|Space)/.test(e.code) && document.getElementById('menu')?.hidden) e.preventDefault(); keys.add(e.code);});
  addEventListener('keyup', e => keys.delete(e.code));
  addEventListener('blur', () => keys.clear());
  function pads() { return navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : []; }
  function syncAssignments() {
    const connected = pads();
    for (const [slot,index] of assigned) if (!connected.some(p => p.index === index)) assigned.delete(slot);
    connected.forEach((p,i) => { if (i < 2 && ![...assigned.values()].includes(p.index) && !assigned.has(i)) assigned.set(i,p.index); });
  }
  function bindingActive(pad, binding) {
    return binding.type === 'button' ? (pad.buttons[binding.index]?.value || 0) > .55 : (pad.axes[binding.index] || 0) * binding.sign > .55;
  }
  function getProfile(pad) {return WW.storage.data.profiles[pad.id] || defaults;}
  function sample(slot) {
    const pad = pads().find(p => p.index === assigned.get(slot)); const profile = pad && getProfile(pad);
    return Object.fromEntries(actions.map(action => [action, keyMaps[slot][action].some(key=>keys.has(key)) || !!(pad && (profile[action] || []).some(b=>bindingActive(pad,b)))]));
  }
  function read(slot) {
    const current = sample(slot); const pressed = {}; const released = {};
    for (const action of actions) { pressed[action] = current[action] && !prev[slot].has(action); released[action] = !current[action] && prev[slot].has(action); }
    prev[slot] = new Set(actions.filter(a=>current[a]));
    return { ...current, pressed, released };
  }
  function reset() { prev.forEach(s=>s.clear()); keys.clear(); syncAssignments(); }
  function rumble(slot, strength=.5, duration=160) {
    if (!WW.storage.data.settings.rumble) return;
    const pad = pads().find(p=>p.index===assigned.get(slot));
    const actuator = pad?.vibrationActuator;
    if (actuator?.playEffect) actuator.playEffect('dual-rumble',{duration,strongMagnitude:strength,weakMagnitude:strength*.7}).catch(()=>{});
  }
  function snapshot(pad) { return { buttons:pad.buttons.map(b=>b.value), axes:[...pad.axes] }; }
  function changed(pad, baseline) {
    for (let i=0;i<pad.buttons.length;i++) if ((pad.buttons[i]?.value || 0) > .65 && (baseline.buttons[i] || 0) < .2) return {type:'button',index:i};
    for (let i=0;i<pad.axes.length;i++) {
      const value=pad.axes[i]; if (Math.abs(value)>.7 && Math.abs(value-(baseline.axes[i] || 0))>.55) return {type:'axis',index:i,sign:Math.sign(value)};
    }
    return null;
  }
  function calibrate(index, onStep, onComplete) {
    const pad = pads().find(p=>p.index===index); if (!pad) return () => {};
    let step=0, base=snapshot(pad), armed=false, frame=0; const result={};
    function tick(){
      const p=pads().find(p=>p.index===index); if(!p)return;
      const neutral = p.buttons.every(b=>b.value<.2) && p.axes.every((a,i)=>Math.abs(a-(base.axes[i]||0)) < .25);
      if(!armed && neutral) armed=true;
      if(armed){const b=changed(p,base); if(b){result[actions[step]]=[b]; step++; armed=false; if(step<actions.length)onStep(step,actions); if(step===actions.length){WW.storage.data.profiles[p.id]=result; WW.storage.save();onComplete();return;}}}
      frame=requestAnimationFrame(tick);
    }
    onStep(0,actions);frame=requestAnimationFrame(tick);
    return ()=>cancelAnimationFrame(frame);
  }
  addEventListener('gamepadconnected',syncAssignments);
  addEventListener('gamepaddisconnected',syncAssignments);
  return {actions,pads,read,reset,rumble,calibrate,syncAssignments,assigned};
})();

</script>
<script>
window.WW = window.WW || {};
WW.levels = (() => {
  const colors = {
    empty: '#ffffff', ground: '#101820', platform: '#5f5b85', water: '#176ad7', p1: '#00ed31', p2: '#91fe54', exit: '#ff152b',
    springaroo: '#ffdc12', skyling: '#00eeef', tideling: '#ef851a', snack: '#ff64bb', skyKey: '#b052fc', diveKey: '#167b86', springKey: '#e83c86', checkpoint: '#aaaaaa',cloudwhisp:'#9480ed',prismtail:'#ff895d',mossback:'#6b9c42',glimmermoth:'#ce6dff',emberkit:'#fc5d3e',starShard:'#f2f28a'
  };
  const palette = Object.entries(colors).map(([name,hex])=>({ name, rgb: [1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)) }));
  const kinds = new Set(['ground','platform','water']);
  const markers = new Set(['p1','p2','exit','springaroo','skyling','tideling','cloudwhisp','prismtail','mossback','glimmermoth','emberkit','snack','skyKey','diveKey','springKey','starShard','checkpoint']);
  function classify(r,g,b,a=255) {
    if (a<80) return {kind:'empty',confidence:1};
    const distances=palette.map(({name,rgb})=>({name,d:Math.sqrt((r-rgb[0])**2+(g-rgb[1])**2+(b-rgb[2])**2)})).sort((a,b)=>a.d-b.d);
    if(distances[0].d<105) return {kind:distances[0].name,confidence:1-distances[0].d/150};
    if(r>210&&g>210&&b>210)return {kind:'empty',confidence:.4};
    if(r<45&&g<45&&b<45)return {kind:'ground',confidence:.4};
    return {kind:'empty',confidence:0};
  }
  // For generated maps, each logical tile may span N image pixels.
  // A majority vote across the central portion of that cell suppresses JPEG-style noise and blurred edges.
  function parseCanvas(image, pixelsPerTile=1) {
    const cols=Math.floor(image.width/pixelsPerTile),rows=Math.floor(image.height/pixelsPerTile);
    if(cols<8||rows<6||cols>400||rows>80) throw Error(`Level grid must be between 8×6 and 400×80 (found ${cols}×${rows})`);
    const canvas=document.createElement('canvas');canvas.width=image.width;canvas.height=image.height;
    const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(image,0,0);
    const data=ctx.getImageData(0,0,image.width,image.height).data;
    const grid=[], objects=[], warnings=[];
    let unknown=0;
    for(let y=0;y<rows;y++){
      const row=[];
      for(let x=0;x<cols;x++){
        const votes=new Map();const tile=pixelsPerTile;
        const pad=tile>=4?Math.max(1,Math.floor(tile*.2)):0;
        const stride=Math.max(1,Math.floor(tile/8));
        for(let yy=pad;yy<tile-pad;yy+=stride)for(let xx=pad;xx<tile-pad;xx+=stride){
          const offset=((y*tile+yy)*image.width+x*tile+xx)*4;
          const sample=classify(...data.slice(offset,offset+4));
          votes.set(sample.kind,(votes.get(sample.kind)||0)+sample.confidence+.001);
          if(sample.confidence===0)unknown++;
        }
        const type=[...votes].sort((a,b)=>b[1]-a[1])[0]?.[0]||'empty';
        row.push(kinds.has(type)?type:'empty');
        if(markers.has(type))objects.push({kind:type,x,y});
      }
      grid.push(row);
    }
    if(!objects.some(o=>o.kind==='p1'))warnings.push('No green player-start marker');
    if(!objects.some(o=>o.kind==='exit'))warnings.push('No red level-exit marker');
    if(unknown>0)warnings.push(`${unknown} unrecognized image samples were treated as empty`);
    return {grid,objects,warnings,width:cols,height:rows};
  }
  function load(url,pixelsPerTile=1) {
    return new Promise((resolve,reject)=>{
      const image=new Image();image.onload=()=>{try{resolve(parseCanvas(image,pixelsPerTile))}catch(e){reject(e)}};
      image.onerror=()=>reject(Error('Could not open the PNG image'));
      image.src=url;
    });
  }
  return {colors,classify,parseCanvas,load};
})();

</script>
<script>
window.WW = window.WW || {};
WW.art = (() => {
  // 64×80 pixel-art sprite frames, with detailed magical silhouettes and micro-highlights.
  // All frames and HUD portraits are drawn locally; no fetched textures.
  const kinds=['hero','springaroo','skyling','tideling','cloudwhisp','prismtail','mossback','glimmermoth','emberkit','snack'];
  const sw=64,sh=80,frames=4;
  const sheet=document.createElement('canvas');sheet.width=sw*frames*kinds.length;sheet.height=sh;
  const g=sheet.getContext('2d');g.imageSmoothingEnabled=false;
  function oval(x,y,rx,ry,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill();}
  function shape(points,color){g.fillStyle=color;g.beginPath();g.moveTo(...points[0]);for(let i=1;i<points.length;i++)g.lineTo(...points[i]);g.closePath();g.fill();}
  function line(points,color,width=2){g.strokeStyle=color;g.lineWidth=width;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(...points[0]);for(let i=1;i<points.length;i++)g.lineTo(...points[i]);g.stroke();}
  function shine(x,y,r=1){oval(x,y,r,r,'#fffce7');}
  function eyes(x=11,y=19,dx=10,color='#263452'){oval(x,y,1.5,2,color);oval(x+dx,y,1.5,2,color);shine(x-.4,y-.7,.55);shine(x+dx-.4,y-.7,.55);}
  function feet(color,phase){
    oval(11,35+(phase?1:0),5,3,color);oval(21,35+(phase?-1:0),5,3,color);
    oval(11,36+(phase?1:0),2,1,'#fff3dc');oval(21,36+(phase?-1:0),2,1,'#fff3dc');
  }
  function hero(f){
    const bounce=f===1?-1:f===3?1:0;
    feet('#354d79',f%2);
    shape([[8,24+bounce],[24,24+bounce],[27,34+bounce],[5,34+bounce]],'#2d547f');
    oval(16,28+bounce,10,7,'#597ead');
    line([[9,29],[16,30],[23,28]],'#f9da89',2);
    oval(16,17+bounce,11,12,'#433755');
    oval(16,18+bounce,9,10,'#ffd2a6');

  let context;
  const tunes = {
    jump:[[420,550,.09,'triangle']], double:[[490,740,.17,'triangle']],
    food:[[500,400,.13,'sine']], orb:[[680,400,.19,'sine']],
    catch:[[480,660,.13,'triangle'],[640,880,.22,'sine'],[920,1160,.29,'sine']],
    miss:[[280,190,.20,'triangle']], gem:[[610,820,.20,'triangle'],[800,1050,.30,'sine'],[1100,1360,.34,'sine']],
    hit:[[240,105,.22,'sawtooth']], sleep:[[350,190,.26,'sine']],

    morph:[[350,800,.22,'triangle'],[600,1120,.27,'sine']],
    recall:[[620,430,.23,'sine'],[460,780,.35,'triangle']],
    win:[[540,720,.22,'triangle'],[670,910,.26,'sine'],[820,1170,.37,'sine']]
  };
  function play(name){
    if(!WW.storage.data.settings.sound)return;
    const Audio=window.AudioContext||window.webkitAudioContext;
    if(!Audio)return;
    context ||=new Audio();
    if(context.state==='suspended')context.resume();
    const notes=tunes[name];if(!notes)return;
    for(const [from,to,length,wave] of notes){
      const oscillator=context.createOscillator(),gain=context.createGain(),start=context.currentTime;
      oscillator.type=wave;oscillator.frequency.setValueAtTime(from,start);
      oscillator.frequency.exponentialRampToValueAtTime(Math.max(10,to),start+length);
      gain.gain.setValueAtTime(.0001,start);
      gain.gain.exponentialRampToValueAtTime(.035/notes.length,start+.016);
      gain.gain.exponentialRampToValueAtTime(.0001,start+length);
      oscillator.connect(gain).connect(context.destination);
      oscillator.start(start);oscillator.stop(start+length+.01);
    }
  }
  return {play};

    function movePlayer(p,controls,dt){

          ctx.fillStyle=color;ctx.beginPath();ctx.arc(x+dx+sway,y+dy,radius,0,Math.PI*2);ctx.fill();
        }
        for(let j=0;j<7;j++){const xx=x-24+(hash(i,j)%50),yy=y-23+(hash(j,i)%33);
          box(ctx,xx,yy,2,3,hash(i,j)%2?'#8befc9':'#d2d2ff');}
        // Hanging lanterns bloom gently, but don't obscure traversal geometry.
        if(i%3===0){box(ctx,x+16,y+7,1,24,'#6fd3ae');
          const glow=ctx.createRadialGradient(x+16,y+31,0,x+16,y+31,14);
          glow.addColorStop(0,'#fff7acb5');glow.addColorStop(1,'#fff7ac00');ctx.fillStyle=glow;ctx.fillRect(x+2,y+17,28,28);
          box(ctx,x+13,y+27,7,7,'#fff2b1');}
      }
    }
    function groundDetails(ctx,time){
      const left=Math.max(0,Math.floor(cameraX/TILE)-1),right=Math.min(level.width,Math.ceil((cameraX+W)/TILE)+1);
      for(let x=left;x<right;x++){
        for(let y=1;y<level.height-1;y++){
          if(map[y]?.[x]!=='ground'||map[y-1]?.[x]!=='empty')continue;
          const px=x*TILE+8,py=y*TILE,h=hash(x,y);
          if(h%9===0){
            box(ctx,px-1,py-18,3,18,'#2a936d');
            box(ctx,px-5,py-22,11,6,'#ff87c2');box(ctx,px-2,py-26,6,7,'#ffd5f2');
            box(ctx,px-1,py-23,3,3,'#ffe68e');
          }else if(h%13===0){
            box(ctx,px-3,py-12,7,10,'#80def5');box(ctx,px-1,py-19,3,7,'#e2f9fa');
            box(ctx,px-6,py-7,4,5,'#d6a5ff');
          }else if(h%4===0){
            box(ctx,px-4,py-5,2,5,'#52c884');box(ctx,px+1,py-8,2,8,'#61d79b');
            box(ctx,px-6,py-9,4,5,'#d4a9ff');box(ctx,px,py-12,4,5,'#ffb5cf');
          }
          if(h%21===0){const f=1+Math.sin(time*3+x)*2;box(ctx,px+4,py-20+f,3,3,'#ffffae');}
        }
      }
    }
    function terrain(ctx,time){
      const left=Math.max(0,Math.floor(cameraX/TILE)-1),right=Math.min(level.width,Math.ceil((cameraX+W)/TILE)+1);
      const top=Math.max(0,Math.floor(cameraY/TILE)-1),bottom=Math.min(level.height,Math.ceil((cameraY+H)/TILE)+1);
      for(let y=top;y<bottom;y++)for(let x=left;x<right;x++){
        const t=map[y][x];if(t==='empty')continue;
        const px=x*TILE,py=y*TILE,h=hash(x,y);
        if(t==='ground'){
          box(ctx,px,py,16,16,'#634a74');box(ctx,px,py+4,16,12,(h%2?'#795781':'#8e6484'));
          if(y===0||map[y-1][x]!=='ground'){
            box(ctx,px,py,16,6,'#68cf8d');box(ctx,px,py+5,16,2,'#378e80');
            box(ctx,px+2,py-2,3,3,'#a4ed96');box(ctx,px+11,py-1,2,3,'#efffa1');
          }
          if(h%5===0)box(ctx,px+5,py+9,4,2,'#f6ad9b');if(h%7===0)box(ctx,px+12,py+12,2,2,'#c38bd7');
          if(h%23===0){box(ctx,px+8,py+6,3,7,'#7b7bb1');box(ctx,px+9,py+5,1,5,'#b1c9f0');}
        } else if(t==='platform'){
          box(ctx,px,py,16,7,'#6659a1');box(ctx,px,py,16,3,'#b2ffd1');
          box(ctx,px+2,py+7,12,3,'#555583');
          box(ctx,px+5,py+10,6,3,'#7f7dba');
          if(h%3===0){box(ctx,px+5,py-3,2,4,'#aeefcf');box(ctx,px+3,py-5,6,3,'#f4a0cf');}
        } else if(t==='water'){
          box(ctx,px,py,16,16,y%2?'#3b89da':'#3f9fde');
          if(y===0||map[y-1][x]!=='water'){box(ctx,px,py,16,3,'#9be5e1');box(ctx,px+(Math.floor(time*9+x*7)%11),py+1,5,1,'#edf9ce');}
          if(h%6===0)box(ctx,px+5,py+8+Math.sin(time*3+x)*2,2,2,'#8fe4e5');
        }
      }
      // tiny foreground blossoms, all procedural and repeatable
      for(let x=left;x<right;x++)for(let y=top+1;y<bottom;y++)if(map[y]?.[x]==='ground'&&map[y-1]?.[x]==='empty'&&hash(x,y)%8===1){
        const px=x*TILE+6,py=y*TILE-2;box(ctx,px,py-4,2,5,'#3e8269');box(ctx,px-2,py-6,6,3,'#f39cc3');box(ctx,px,py-7,2,2,'#ffea9f');
      }
    }
    function render(ctx,now){
      ctx.setTransform(3,0,0,3,0,0);
      background(ctx,now);
      ctx.save();ctx.translate(Math.round((Math.random()-.5)*shake),Math.round((Math.random()-.5)*shake));ctx.translate(-Math.round(cameraX),-Math.round(cameraY));
      sceneryBack(ctx,now);terrain(ctx,now);groundDetails(ctx,now);
      items.forEach(it=>{if(it.used)return;const bob=Math.sin(now*3+it.x)*2;
        if(it.kind==='snack')WW.art.draw(ctx,'snack',it.x,it.y+8+bob,Math.floor(now*3)%4);
        if(it.kind==='starShard'){
          ctx.save();ctx.translate(it.x,it.y+bob);ctx.rotate(Math.sin(now*3+it.x)*.22);
          ctx.fillStyle='#fff8bd';ctx.beginPath();for(let i=0;i<10;i++){
            const a=i*Math.PI/5-Math.PI/2,r=i%2?3:8;
            ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
          }ctx.closePath();ctx.fill();box(ctx,-1,-3,2,4,'#ffffff');ctx.restore();
        }
        if(it.kind==='skyKey'||it.kind==='diveKey'||it.kind==='springKey'){
          const tint=it.kind==='skyKey'?'#fff0a3':it.kind==='springKey'?'#ff94d5':'#91f5ff';
          ctx.save();ctx.translate(it.x,it.y+bob);ctx.rotate(now*.65);
          box(ctx,-5,-5,10,10,tint);box(ctx,-2,-10,4,5,'#ffffff');box(ctx,6,-2,5,4,tint);box(ctx,-9,-1,4,3,tint);ctx.restore();
          ctx.globalAlpha=.65+.3*Math.sin(now*5);box(ctx,it.x-2,it.y-13+bob,4,2,'#fffcef');box(ctx,it.x+12,it.y+bob,3,3,tint);ctx.globalAlpha=1;
          ctx.fillStyle='#fff4dd';ctx.font='bold 8px sans-serif';ctx.fillText('GEM',it.x-9,it.y-19+bob);
        }
        if(it.kind==='exit'){
          box(ctx,it.x-12,it.y-28,24,36,'#725771');box(ctx,it.x-8,it.y-25,16,31,shared.skyKey&&shared.diveKey&&shared.springKey?'#6befc6':'#423c6b');
          box(ctx,it.x-5,it.y-20,10,14,'#af9abb');box(ctx,it.x-3,it.y-19,6,10,'#433f7d');box(ctx,it.x+4,it.y-9,2,2,'#ffdc80');
        }
        if(it.kind==='checkpoint') {box(ctx,it.x-2,it.y-22,3,27,'#765968');box(ctx,it.x+1,it.y-22,14,9,'#9bf6c9');}
      });
      animals.forEach(a=>{
        if(!a.alive)return;
        const frame=Math.floor(a.frame)%4;
        WW.art.draw(ctx,a.kind,a.x,a.y,frame,a.dir<0);
        const wary=a.wary;box(ctx,a.x-13,a.y-49,26,4,'#263f46');box(ctx,a.x-12,a.y-48,24*(wary/100),2,wary>40?'#fa8c82':'#a1eaa2');
        if(!wary){box(ctx,a.x-2,a.y-52,4,3,'#ff9eb6');box(ctx,a.x-4,a.y-50,8,3,'#ff9eb6');}
        const chance=Math.round((.12+.86*Math.pow(1-a.wary/100,1.55))*100);
        ctx.fillStyle='#f4fbef';ctx.font='bold 7px sans-serif';
        ctx.fillText(titles[a.kind],a.x-17,a.y-59);
        if(a.wary<100){ctx.fillStyle='#fceab0';ctx.fillText(`Catch ${chance}%`,a.x-17,a.y-51);}
      });
      projectiles.forEach(pr=>{
        const color=pr.kind==='food'?FOOD[pr.food].color:({orb:'#d8bcff',feather:'#f7eec7',bubble:'#9fe4fa',thorn:'#f5ae7a',gust:'#c4f4ff',spark:'#ffcbb9',seed:'#b4eb98',starlight:'#edc9ff',ember:'#ffb675'}[pr.kind]||'#ffffff');
        box(ctx,pr.x-4,pr.y-4,8,8,'#273e55');box(ctx,pr.x-3,pr.y-3,6,6,color);if(pr.kind==='orb'||pr.kind==='food')box(ctx,pr.x-1,pr.y-2,2,2,'#ffffff');
      });
      players.forEach(p=>{
        if(p.sleep){
          WW.art.draw(ctx,'hero',p.x,p.y+8,1,p.face<0,p.id);
          ctx.font='bold 10px sans-serif';ctx.fillStyle='#f9fbff';
          ctx.fillText('z',p.x+10,p.y-24-Math.sin(now*2)*3);ctx.fillText('Z',p.x+19,p.y-33-Math.sin(now*2+.8)*3);
        }else{
          if(p.form){ctx.save();ctx.globalAlpha=.19+.09*Math.sin(now*5);ctx.fillStyle=FORM[p.form].color;ctx.beginPath();ctx.ellipse(p.x,p.y-13,18,23,0,0,Math.PI*2);ctx.fill();ctx.restore();}
          WW.art.draw(ctx,p.form||'hero',p.x,p.y,Math.floor(p.frame)%4,p.face<0,p.id);
        }
        // Colored player markers remain clear even while transformed.
        box(ctx,p.x-8,p.y-43,16,3,'#152e42');box(ctx,p.x-7,p.y-42,14,2,p.id===0?'#ffd782':'#91d2ff');
        ctx.font='bold 8px sans-serif';ctx.fillStyle='#102b41';ctx.fillText(String(p.id+1),p.x-2,p.y-46);
      });
      effects.forEach(e=>box(ctx,e.x,e.y,3,3,e.color));ctx.restore();
      if(!shared.skyKey||!shared.diveKey||!shared.springKey){
        box(ctx,8,H-23,453,16,'#14243cda');ctx.font='bold 8px sans-serif';ctx.fillStyle='#fff3c6';ctx.fillText(!shared.springKey?'SPRINGAROO ➜ double-jump to the canopy gem':!shared.skyKey?'MOONWING ➜ fly to the sky gem':'TIDEFOX ➜ dive to the river gem · C to return to camp',15,H-12);
      }
    }
    hud.hidden=false;say('Catch three magical creatures. Their powers unlock three gems!',3600);
    return {update,render,recallParty,stop(){hud.hidden=true;message.classList.remove('show');},get state(){return {players,shared,animals,items,projectiles,cameraX,cameraY,physics:PHYSICS,jumpHeight}}};
  }
  return {start};
})();

<script>
window.WW = window.WW || {};
WW.main = (() => {
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
  const menu=document.getElementById('menu');const hud=document.getElementById('hud');
  let game=null,last=0,paused=true,screen='home',cancelCalibration=null,customMap=null,pixelsPerTile=1,menuPadLatch='';
  const builtinMap=window.WONDERWOOD_MAP.startsWith('data:')?window.WONDERWOOD_MAP:'src/games/animal-adventure/levels/first-forest.png';
  const panel=(content)=>{menu.hidden=false;menu.innerHTML=`<section class="panel">${content}</section>`;menu.querySelector('button')?.focus({preventScroll:true});};
  const button=(id,label,kind='secondary')=>`<button class="${kind}" data-action="${id}">${label}</button>`;
  function home(){
    if(game){game.stop();game=null;}paused=true;screen='home';cancelCalibration?.();cancelCalibration=null;
    const portraits=Object.keys(WW.catalog.forms).map(t=>`<span class="menu-creature" title="${WW.catalog.forms[t].name} · ${WW.catalog.forms[t].power}"><img src="${WW.art.portrait(t)}" alt="${WW.catalog.forms[t].name}"></span>`).join('');
    panel(`<div class="kicker">The enchanted forest is calling</div><h1>WONDERWOOD</h1>
      <h2>Be kind. Be brave. Become magical.</h2>
      <div class="menu-portraits">${portraits}</div>
      <p>Eight whimsical creatures, five magical snacks and three ancient gems. Win creatures over, catch them, transform into them and use their powers to solve the forest's secrets. You can switch forms and save their remaining time!</p>
      <div class="buttons">${button('play','▶ PLAY FIRST FOREST','primary')}${button('journal','✦ Creature guide')}${button('settings','⚙ Settings')}${button('calibrate','🎮 Controller setup')}${button('level','▧ Load PNG map')}</div>
      <div class="instructions"><b>Keyboard P1:</b> A / D move · W jump · F food · E change food · G catch orb · Q choose form · T transform · R wake · C back to camp<br>
      <b>Keyboard P2:</b> J / L move · I jump · O food · M change food · P catch orb · H choose form · U transform · Y wake · N back to camp<br>
      <b>Menu:</b> Arrow keys + Enter, or Tab + Enter · Escape pauses · All gems auto-collect on contact</div>
      <div class="hint">${customMap?'Custom map selected.':'First Forest · three gems · unlimited homeward spell'} &nbsp; · &nbsp; ${WW.input.pads().length} controller(s) detected</div>`);
  }
  async function play() {
    const url=customMap||builtinMap;
    if(game){game.stop();game=null;}
    paused=true;screen='loading';
    panel('<div class="kicker">Unfolding the forest map</div><h2>Loading adventure…</h2>');
    try{
      const level=await WW.levels.load(url,pixelsPerTile);
      if(level.warnings.some(w=>w.startsWith('No ')))throw Error(level.warnings.join(' · '));
      WW.input.reset();game=WW.games.animals.start(level);menu.hidden=true;paused=false;screen='playing';last=0;
      if(level.warnings.length)game && console.warn('Level warnings:',level.warnings);
      if(document.activeElement instanceof HTMLElement)document.activeElement.blur();
    }catch(error){screen='error';panel(`<h2>Couldn't read this level</h2><p class="warning" id="error"></p><div class="buttons">${button('home','Back to menu')}</div>`);document.getElementById('error').textContent=error.message;}
  }
  function settings(){
    screen='settings';const settings=WW.storage.data.settings;
    panel(`<div class="kicker">Wonderwood Arcade</div><h2>Game settings</h2>
      <p>Controls and progress are stored in this browser. Export a save to keep a backup when you move the HTML file.</p>
      <div class="row"><label for="players">Players</label><select id="players"><option value="1" ${settings.players===1?'selected':''}>1 player</option><option value="2" ${settings.players===2?'selected':''}>2 players</option></select></div>
      <label class="toggle"><input id="rumble" type="checkbox" ${settings.rumble?'checked':''}> Controller vibration (if supported)</label><label class="toggle"><input id="sound" type="checkbox" ${settings.sound?'checked':''}> Magical sound effects</label>
      <div class="buttons">${button('save-settings','Save settings','primary')}${button('export','Export save')}${button('import','Import save')}${button('home','Back')}</div>
      <input id="save-file" type="file" accept="application/json,.json" hidden>
      <div class="instructions">Controller vibration support varies by gamepad, Linux driver, and Firefox version.</div>`);
    document.getElementById('save-file').addEventListener('change',async(e)=>{
      const file=e.target.files[0];if(!file)return;
      try{await WW.storage.importSave(file);settings();}
      catch(err){alert(err.message);}
    });
  }
  function calibration(){
    screen='calibration';const pads=WW.input.pads();if(!pads.length){panel(`<div class="kicker">Controller setup</div><h2>No gamepad detected</h2><p>Connect a USB controller, then press any button on it while Firefox is focused. The browser only exposes gamepads after interaction.</p><div class="buttons">${button('calibrate','Try again','primary')}${button('home','Back')}</div>`);return;}
    const p=pads[0];
    panel(`<div class="kicker">Controller setup · ${p.index+1}</div><h2>Press the requested control</h2><p id="calibration-step"></p><p class="hint">Release each control before the next step. Saves automatically by controller name.</p><div class="buttons">${button('home','Cancel')}</div>`);
    const display={left:'MOVE LEFT',right:'MOVE RIGHT',down:'DIVE DOWN',jump:'JUMP / FLY',snack:'THROW SELECTED FOOD',orb:'MAGIC CATCH ORB',cycle:'CHOOSE ANIMAL',transform:'SWITCH FORM',revive:'WAKE / REVIVE',foodCycle:'CHANGE FOOD',recall:'RETURN TO CAMP'};
    cancelCalibration=WW.input.calibrate(p.index,(step,actions)=>{
      const element=document.getElementById('calibration-step');
      if(element)element.textContent=`${step+1} / ${actions.length} — ${display[actions[step]]}`;
    },()=>{cancelCalibration=null;WW.input.rumble(0,.6,220);panel(`<h2>Controller saved!</h2><p>The mapping will load automatically whenever this controller connects.</p><div class="buttons">${button('home','Back to menu','primary')}</div>`);});
  }
  function level(){
    screen='level';panel(`<div class="kicker">For level creators · AI-assisted maps</div><h2>Load your own PNG map</h2>
      <p>Use the palette from README.md. One pixel is one tile by default; for an AI-generated image with large color blocks, enter the number of image pixels per tile. The parser uses center sampling and approximate colors.</p>
      <div class="row"><label>PNG <input type="file" id="level-file" accept="image/png"></label><label>Pixels per tile <input id="tile-size" type="number" min="1" max="64" value="1" style="width:70px"></label></div>
      <p class="hint">A green start marker and a red exit marker are required. Unknown colors become empty terrain and are reported in the console.</p>
      <div class="buttons">${button('load-level','Use this level','primary')}${button('reset-level','Use built-in level')}${button('home','Back')}</div>`);
  }
  function journal(){
    screen='journal';
    const creatures=Object.entries(WW.catalog.forms).map(([kind,c])=>`<div class="journal-card"><img src="${WW.art.portrait(kind)}" alt=""><div><b>${c.name}</b><small>${c.power} · ${c.seconds}s per catch<br>Loves ${WW.catalog.foods[c.favorite].name}</small></div></div>`).join('');
    const foods=Object.entries(WW.catalog.foods).map(([kind,c])=>`<span class="food-guide"><img src="${WW.art.foodIcon(kind)}" alt="">${c.name} <small>(${c.method})</small></span>`).join('');
    panel(`<div class="kicker">Forest field guide</div><h2>Meet the magical neighbors</h2><p>Every catch gives the catching player more time in that form. Transform again to switch or return to explorer; unused time is always saved.</p>
      <div class="journal-grid">${creatures}</div><h3>Picnic powers</h3><div class="guide-foods">${foods}</div><p>Favorite snacks calm creatures faster. Nectar mist reaches several nearby creatures; honeybombs charm groups in a splash.</p>
      <div class="buttons">${button('home','Back to menu','primary')}</div>`);
  }
  function pause(){if(!game||screen!=='playing')return;paused=true;screen='paused';panel(`<div class="kicker">Adventure on hold</div><h2>Paused</h2><p>Snack time? Your forest friends will still be here.</p><div class="buttons">${button('resume','Resume','primary')}${button('camp','Return everyone to camp')}${button('restart','Restart level')}${button('home','Main menu')}</div>`);}
  function win(wins,shards=0,total=0){paused=true;screen='won';panel(`<div class="kicker">A forest full of friends</div><h1>YOU DID IT!</h1><h2>You gathered all three gems. The enchanted gate is open!</h2><p>Your teamwork saved the day. Bonus star shards: ${shards}/${total}. Adventures completed: ${wins}. The animals are already getting up to more mischief.</p><div class="buttons">${button('restart','Play again','primary')}${button('home','Arcade menu')}</div>`);}
  menu.addEventListener('click',async e=>{
    const id=e.target.closest('button')?.dataset.action;
    if(!id)return;
    if(id==='play'||id==='restart')await play();
    if(id==='home')home();
    if(id==='settings')settings();
    if(id==='journal')journal();
    if(id==='calibrate')calibration();
    if(id==='level')level();
    if(id==='camp'&&screen==='paused'){game.recallParty();paused=false;screen='playing';menu.hidden=true;last=0;}
    if(id==='resume'&&screen==='paused'){paused=false;screen='playing';menu.hidden=true;WW.input.reset();last=0;}
    if(id==='save-settings'){WW.storage.data.settings.players=Number(document.getElementById('players').value);WW.storage.data.settings.rumble=document.getElementById('rumble').checked;WW.storage.data.settings.sound=document.getElementById('sound').checked;WW.storage.save();home();}
    if(id==='export')WW.storage.exportSave();
    if(id==='import')document.getElementById('save-file').click();
    if(id==='reset-level'){customMap=null;pixelsPerTile=1;home();}
    if(id==='load-level'){
      const file=document.getElementById('level-file').files[0];if(!file){alert('Select a PNG file first.');return;}
      const size=Number(document.getElementById('tile-size').value);

      customMap=URL.createObjectURL(file);pixelsPerTile=size;await play();
    }
  });
  addEventListener('keydown',e=>{
    if(e.code==='Escape'){
      if(screen==='playing'){e.preventDefault();pause();}
      else if(screen==='paused'){e.preventDefault();paused=false;screen='playing';menu.hidden=true;WW.input.reset();last=0;}
      else if(!['home','loading','won'].includes(screen)){e.preventDefault();home();}
      return;
    }
    if(menu.hidden||!['ArrowDown','ArrowRight','ArrowUp','ArrowLeft','KeyW','KeyS'].includes(e.code))return;
    if(e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) return;
    const buttons=[...menu.querySelectorAll('button:not([disabled])')];
    if(!buttons.length)return;
    e.preventDefault();const index=buttons.indexOf(document.activeElement);
    const forward=['ArrowDown','ArrowRight','KeyS'].includes(e.code);
    buttons[(index+(forward?1:-1)+buttons.length)%buttons.length].focus();
  });
  function pollMenuGamepad(){
    if(menu.hidden || screen==='calibration'){menuPadLatch='';return;}
    const pad=WW.input.pads()[0];if(!pad){menuPadLatch='';return;}
    const left=pad.buttons[14]?.pressed||pad.axes[0]<-.55;
    const right=pad.buttons[15]?.pressed||pad.axes[0]>.55;
    const up=pad.buttons[12]?.pressed||pad.axes[1]<-.55;
    const down=pad.buttons[13]?.pressed||pad.axes[1]>.55;
    const confirm=pad.buttons[0]?.pressed;
    const value=confirm?'confirm':left||up?'previous':right||down?'next':'';
    if(value&&value!==menuPadLatch){
      const buttons=[...menu.querySelectorAll('button:not([disabled])')];
      if(value==='confirm')document.activeElement?.click?.();
      else if(buttons.length){const selected=buttons.indexOf(document.activeElement);
        buttons[(selected+(value==='next'?1:-1)+buttons.length)%buttons.length].focus({preventScroll:true});}
    }
    menuPadLatch=value;
  }
  function idle(now){
    ctx.setTransform(3,0,0,3,0,0);
    const t=now*.001;const sky=ctx.createLinearGradient(0,0,0,270);sky.addColorStop(0,'#73b6cf');sky.addColorStop(1,'#dbedcf');ctx.fillStyle=sky;ctx.fillRect(0,0,480,270);
    for(let layer=0;layer<3;layer++){
      const h=135+layer*38;ctx.fillStyle=['#aacfc1','#77b0a9','#427e7a'][layer];ctx.beginPath();ctx.moveTo(0,270);
      for(let x=0;x<500;x+=16)ctx.lineTo(x,h+Math.sin(x*.023+layer+t*.06)*14+Math.sin(x*.09)*6);ctx.lineTo(480,270);ctx.fill();
    }
    for(let i=0;i<25;i++){const x=i*24+(Math.sin(i*2)*8);ctx.fillStyle='#285963';ctx.fillRect(x,201,5,60);ctx.fillStyle=i%2?'#478b79':'#57987b';ctx.fillRect(x-9,178+Math.sin(i)*12,24,28);}
    ctx.fillStyle='#89bd71';ctx.fillRect(0,244,480,26);
    for(let x=0;x<480;x+=16){ctx.fillStyle='#528b69';ctx.fillRect(x,243,16,3);ctx.fillStyle='#a0d181';ctx.fillRect(x+4,240,3,4);}
    WW.art.draw(ctx,'springaroo',85,244,Math.floor(t*3)%4);WW.art.draw(ctx,'skyling',375,183+Math.sin(t*2)*5,Math.floor(t*6)%4);WW.art.draw(ctx,'tideling',135,244,Math.floor(t*3)%4);WW.art.draw(ctx,'hero',235,242,Math.floor(t*2)%4);
  }
  function frame(now){const dt=last?Math.min((now-last)/1000,.05):0;last=now;if(game){if(!paused)game.update(dt);game.render(ctx,now/1000);}else idle(now);
    pollMenuGamepad();requestAnimationFrame(frame);}
  WW.storage.load();WW.input.syncAssignments();home();requestAnimationFrame(frame);
  return {home,pause,win,play,get game(){return game}};
})();
