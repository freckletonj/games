  <script>
window.WW = window.WW || {};
WW.storage = (() => {
  const KEY = 'wonderwood-save-v1';
  const initial = () => ({ settings: { rumble: true, players: 2 }, profiles: {}, progress: { wins: 0 } });
  let data = initial();
  function load() {
    const stored = localStorage.getItem(KEY);
    if (stored) {
      const parsed = JSON.parse(stored);
      data = { ...initial(), ...parsed, settings: { ...initial().settings, ...parsed.settings } };
    }
    return data;
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(data)); }
  function exportSave() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'wonderwood-save.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  async function importSave(file) {
    const incoming = JSON.parse(await file.text());
    if (!incoming || typeof incoming !== 'object' || !incoming.settings || !incoming.profiles) throw Error('Not a Wonderwood save file');
    data = { ...initial(), ...incoming, settings: { ...initial().settings, ...incoming.settings } }; save();
  }
  return { load, save, exportSave, importSave, get data() { return data; } };
})();

<script>
window.WW = window.WW || {};
WW.input = (() => {
  const actions = ['left','right','down','jump','snack','orb','cycle','transform','revive'];
  const defaults = { left:[{type:'axis',index:0,sign:-1},{type:'button',index:14}],right:[{type:'axis',index:0,sign:1},{type:'button',index:15}],down:[{type:'axis',index:1,sign:1},{type:'button',index:13}],jump:[{type:'button',index:0}],snack:[{type:'button',index:1}],orb:[{type:'button',index:2}],cycle:[{type:'button',index:5}],transform:[{type:'button',index:3}],revive:[{type:'button',index:4}] };
  const keyMaps = [ { left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],down:['KeyS','ArrowDown'],jump:['KeyW','Space','ArrowUp'],snack:['KeyF'],orb:['KeyG'],cycle:['KeyQ'],transform:['KeyT'],revive:['KeyR'] }, { left:['KeyJ'],right:['KeyL'],down:['KeyK'],jump:['KeyI'],snack:['KeyO'],orb:['KeyP'],cycle:['KeyH'],transform:['KeyU'],revive:['KeyY'] } ];
  const keys = new Set(); const prev = [new Set(), new Set()]; const assigned = new Map();
  addEventListener('keydown', e => {if (/^(Arrow|Space)/.test(e.code)) e.preventDefault(); keys.add(e.code);});
  addEventListener('keyup', e => keys.delete(e.code));
  addEventListener('blur', () => keys.clear());
  function pads() { return navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : []; }
  function syncAssignments() {
    const connected = pads();
    for (const [slot,index] of assigned) if (!connected.some(p => p.index === index)) assigned.delete(slot);
    connected.forEach((p,i) => { if (i < 2 && ![...assigned.values()].includes(p.index) && !assigned.has(i)) assigned.set(i,p.index); });
  }
  function bindingActive(pad, binding) {
    return binding.type === 'button' ? (pad.buttons[binding.index]?.value || 0) > .55 : (pad.axes[binding.index] || 0) * binding.sign > .55;
  }
  function getProfile(pad) {return WW.storage.data.profiles[pad.id] || defaults;}
  function sample(slot) {
    const pad = pads().find(p => p.index === assigned.get(slot)); const profile = pad && getProfile(pad);
    return Object.fromEntries(actions.map(action => [action, keyMaps[slot][action].some(key=>keys.has(key)) || !!(pad && (profile[action] || []).some(b=>bindingActive(pad,b)))]));
  }
  function read(slot) {
    const current = sample(slot); const pressed = {}; const released = {};
    for (const action of actions) { pressed[action] = current[action] && !prev[slot].has(action); released[action] = !current[action] && prev[slot].has(action); }
    prev[slot] = new Set(actions.filter(a=>current[a]));
    return { ...current, pressed, released };
  }
  function reset() { prev.forEach(s=>s.clear()); keys.clear(); syncAssignments(); }
  function rumble(slot, strength=.5, duration=160) {
    if (!WW.storage.data.settings.rumble) return;
    const pad = pads().find(p=>p.index===assigned.get(slot));
    const actuator = pad?.vibrationActuator;
    if (actuator?.playEffect) actuator.playEffect('dual-rumble',{duration,strongMagnitude:strength,weakMagnitude:strength*.7}).catch(()=>{});
  }
  function snapshot(pad) { return { buttons:pad.buttons.map(b=>b.value), axes:[...pad.axes] }; }
  function changed(pad, baseline) {
    for (let i=0;i<pad.buttons.length;i++) if ((pad.buttons[i]?.value || 0) > .65 && (baseline.buttons[i] || 0) < .2) return {type:'button',index:i};
    for (let i=0;i<pad.axes.length;i++) {
      const value=pad.axes[i]; if (Math.abs(value)>.7 && Math.abs(value-(baseline.axes[i] || 0))>.55) return {type:'axis',index:i,sign:Math.sign(value)};
    }
    return null;
  }
  function calibrate(index, onStep, onComplete) {
    const pad = pads().find(p=>p.index===index); if (!pad) return () => {};
    let step=0, base=snapshot(pad), armed=false, frame=0; const result={};
    function tick(){
      const p=pads().find(p=>p.index===index); if(!p)return;
      const neutral = p.buttons.every(b=>b.value<.2) && p.axes.every((a,i)=>Math.abs(a-(base.axes[i]||0)) < .25);
      if(!armed && neutral) armed=true;
      if(armed){const b=changed(p,base); if(b){result[actions[step]]=[b]; step++; armed=false; onStep(step,actions); if(step===actions.length){WW.storage.data.profiles[p.id]=result; WW.storage.save();onComplete();return;}}}
      frame=requestAnimationFrame(tick);
    }
    onStep(0,actions);frame=requestAnimationFrame(tick);
    return ()=>cancelAnimationFrame(frame);
  }
  addEventListener('gamepadconnected',syncAssignments);
  addEventListener('gamepaddisconnected',syncAssignments);
  return {actions,pads,read,reset,rumble,calibrate,syncAssignments,assigned};
})();

</script>
<script>
window.WW = window.WW || {};
WW.levels = (() => {
  const colors = {
    empty: '#ffffff', ground: '#101820', platform: '#5f5b85', water: '#176ad7', p1: '#00ed31', p2: '#91fe54', exit: '#ff152b',
    springaroo: '#ffdc12', skyling: '#00eeef', tideling: '#ef851a', snack: '#ff64bb', skyKey: '#b052fc', diveKey: '#167b86', springKey: '#e83c86', checkpoint: '#aaaaaa'
  };
  const palette = Object.entries(colors).map(([name,hex])=>({ name, rgb: [1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)) }));
  const kinds = new Set(['ground','platform','water']);
  const markers = new Set(['p1','p2','exit','springaroo','skyling','tideling','snack','skyKey','diveKey','springKey','checkpoint']);
  function classify(r,g,b,a=255) {
    if (a<80) return {kind:'empty',confidence:1};
    const distances=palette.map(({name,rgb})=>({name,d:Math.sqrt((r-rgb[0])**2+(g-rgb[1])**2+(b-rgb[2])**2)})).sort((a,b)=>a.d-b.d);
    if(distances[0].d<105) return {kind:distances[0].name,confidence:1-distances[0].d/150};
    if(r>210&&g>210&&b>210)return {kind:'empty',confidence:.4};
    if(r<45&&g<45&&b<45)return {kind:'ground',confidence:.4};
    return {kind:'empty',confidence:0};
  }
  // For generated maps, each logical tile may span N image pixels.
  // A majority vote across the central portion of that cell suppresses JPEG-style noise and blurred edges.
  function parseCanvas(image, pixelsPerTile=1) {
    const cols=Math.floor(image.width/pixelsPerTile),rows=Math.floor(image.height/pixelsPerTile);
    if(cols<8||rows<6||cols>400||rows>80) throw Error(`Level grid must be between 8×6 and 400×80 (found ${cols}×${rows})`);
    const canvas=document.createElement('canvas');canvas.width=image.width;canvas.height=image.height;
    const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(image,0,0);
    const data=ctx.getImageData(0,0,image.width,image.height).data;
    const grid=[], objects=[], warnings=[];
    let unknown=0;
    for(let y=0;y<rows;y++){
      const row=[];
      for(let x=0;x<cols;x++){
        const votes=new Map();const tile=pixelsPerTile;
        const pad=tile>=4?Math.max(1,Math.floor(tile*.2)):0;
        const stride=Math.max(1,Math.floor(tile/8));
        for(let yy=pad;yy<tile-pad;yy+=stride)for(let xx=pad;xx<tile-pad;xx+=stride){
          const offset=((y*tile+yy)*image.width+x*tile+xx)*4;
          const sample=classify(...data.slice(offset,offset+4));
          votes.set(sample.kind,(votes.get(sample.kind)||0)+sample.confidence+.001);
          if(sample.confidence===0)unknown++;
        }
        const type=[...votes].sort((a,b)=>b[1]-a[1])[0]?.[0]||'empty';
        row.push(kinds.has(type)?type:'empty');
        if(markers.has(type))objects.push({kind:type,x,y});
      }
      grid.push(row);
    }
    if(!objects.some(o=>o.kind==='p1'))warnings.push('No green player-start marker');
    if(!objects.some(o=>o.kind==='exit'))warnings.push('No red level-exit marker');
    if(unknown>0)warnings.push(`${unknown} unrecognized image samples were treated as empty`);
    return {grid,objects,warnings,width:cols,height:rows};
  }
  function load(url,pixelsPerTile=1) {
    return new Promise((resolve,reject)=>{
      const image=new Image();image.onload=()=>{try{resolve(parseCanvas(image,pixelsPerTile))}catch(e){reject(e)}};
      image.onerror=()=>reject(Error('Could not open the PNG image'));
      image.src=url;
    });
  }
  return {colors,classify,parseCanvas,load};
})();

</script>
<script>
window.WW = window.WW || {};
WW.art = (() => {
  // Native 32×40 illustrations, rather than 12×16 colored masks. The canvas
  // itself renders at 2× logical resolution, keeping the edges crisp.
  const kinds=['hero','springaroo','skyling','tideling','snack'];
  const sw=32,sh=40,frames=4;
  const sheet=document.createElement('canvas');sheet.width=sw*frames*kinds.length;sheet.height=sh;
  const g=sheet.getContext('2d');g.imageSmoothingEnabled=false;
  function oval(x,y,rx,ry,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill();}
  function shape(points,color){g.fillStyle=color;g.beginPath();g.moveTo(...points[0]);for(let i=1;i<points.length;i++)g.lineTo(...points[i]);g.closePath();g.fill();}
  function line(points,color,width=2){g.strokeStyle=color;g.lineWidth=width;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(...points[0]);for(let i=1;i<points.length;i++)g.lineTo(...points[i]);g.stroke();}
  function shine(x,y,r=1){oval(x,y,r,r,'#fffce7');}
  function eyes(x=11,y=19,dx=10,color='#263452'){oval(x,y,1.5,2,color);oval(x+dx,y,1.5,2,color);shine(x-.4,y-.7,.55);shine(x+dx-.4,y-.7,.55);}
  function feet(color,phase){
    oval(11,35+(phase?1:0),5,3,color);oval(21,35+(phase?-1:0),5,3,color);
    oval(11,36+(phase?1:0),2,1,'#fff3dc');oval(21,36+(phase?-1:0),2,1,'#fff3dc');
  }
  function hero(f){
    const bounce=f===1?-1:f===3?1:0;
    feet('#354d79',f%2);
    shape([[8,24+bounce],[24,24+bounce],[27,34+bounce],[5,34+bounce]],'#2d547f');
    oval(16,28+bounce,10,7,'#597ead');
    line([[9,29],[16,30],[23,28]],'#f9da89',2);
    oval(16,17+bounce,11,12,'#433755');
    oval(16,18+bounce,9,10,'#ffd2a6');
    oval(8,24+bounce,2,4,'#ebac9b');oval(24,24+bounce,2,4,'#ebac9b');
    oval(10,11+bounce,7,5,'#5b405f');oval(21,10+bounce,7,5,'#5b405f');
    shape([[5,12+bounce],[9,5+bounce],[23,5+bounce],[27,12+bounce]],'#4c3858');
    line([[7,12+bounce],[16,9+bounce],[25,12+bounce]],'#76536c',2);
    eyes(12,19+bounce,8);oval(16,24+bounce,2,1,'#d97785');
    oval(4,27,3,4,'#d1a1a1');oval(28,27,3,4,'#d1a1a1');
    shape([[10,27],[16,24],[22,27],[20,31],[12,31]],'#ffcb8d');
    shine(12,12,1.2);
  }
  function springaroo(f){
    const bounce=f===1?-2:f===3?1:0;
    shape([[21,29+bounce],[28,25+bounce],[30,28+bounce],[29,33+bounce],[22,35+bounce]],'#8e4979');
    line([[23,28+bounce],[27,31+bounce],[29,30+bounce]],'#ffca8a',2);
    feet('#8a4875',f%2);
    oval(16,27+bounce,11,11,'#bb668d');oval(16,29+bounce,7,6,'#ffd298');
    shape([[7,17+bounce],[5,2+bounce],[11,5+bounce],[14,16+bounce]],'#9e567e');
    shape([[21,16+bounce],[24,1+bounce],[29,4+bounce],[25,19+bounce]],'#9e567e');
    shape([[8,12+bounce],[8,5+bounce],[12,12+bounce]],'#f6abce');
    shape([[23,12+bounce],[25,5+bounce],[26,13+bounce]],'#f6abce');
    oval(16,19+bounce,12,10,'#da89a8');
    oval(16,24+bounce,7,4,'#ffcaac');eyes(11,19+bounce,10);
    oval(16,24+bounce,2,1.5,'#9a4979');
    shape([[16,7+bounce],[18,12+bounce],[24,14+bounce],[18,16+bounce],[16,21+bounce],[14,16+bounce],[8,14+bounce],[14,12+bounce]],'#ffe48d');
    oval(8,27+bounce,3,3,'#eeb9cf');oval(24,27+bounce,3,3,'#eeb9cf');
    shine(16,14+bounce,1.2);
  }
  function skyling(f){
    const spread=f%2===0?14:10;
    shape([[14,21],[2,13-(f%2)*3],[3,27],[12,30]],'#6198c7');
    shape([[18,21],[30,13-(f%2)*3],[29,27],[20,30]],'#6198c7');
    shape([[13,23],[2,17],[6,29],[13,27]],'#8ce5e4');
    shape([[19,23],[30,17],[26,29],[19,27]],'#8ce5e4');
    line([[4,22],[10,23],[14,26]],'#c7f9db',2);line([[28,22],[22,23],[18,26]],'#c7f9db',2);
    oval(16,25,9,10,'#485baf');oval(16,27,6,8,'#adccef');
    oval(16,15,11,9,'#8f8acc');
    shape([[12,8],[16,2],[20,8]],'#f5e7a5');
    shape([[5,11],[1,8],[5,6],[9,10]],'#c3ebf4');
    shape([[27,11],[31,8],[27,6],[23,10]],'#c3ebf4');
    eyes(11,16,10,'#27345c');shape([[14,22],[16,25],[18,22]],'#ffd891');
    feet('#f1b879',f%2);
    shine(10,11,1.1);shine(24,12,1);
  }
  function tideling(f){
    const wave=f%2?2:-2;
    shape([[22,25],[28,24+wave],[30,17+wave],[31,28+wave],[28,34],[21,33]],'#327d92');
    shape([[25,25],[30,22+wave],[30,29+wave]],'#84e9d4');
    feet('#3a7f99',f%2);
    oval(16,28,12,10,'#358ca7');oval(16,29,8,7,'#b1e9dd');
    shape([[6,17],[4,7],[11,13]],'#328ca7');shape([[26,17],[28,7],[21,13]],'#328ca7');
    shape([[6,14],[7,10],[11,15]],'#8de5df');shape([[26,14],[25,10],[21,15]],'#8de5df');
    oval(16,19,12,10,'#58b7bf');oval(16,24,7,4,'#d0f3e2');
    eyes(11,19,10);oval(16,24,2,1.5,'#33546d');
    oval(6,24,4,2,'#7cdbc7');oval(26,24,4,2,'#7cdbc7');
    line([[5,22],[1,20]],'#d5fcfa',1);line([[27,22],[31,20]],'#d5fcfa',1);
    shape([[13,7],[16,2],[19,7],[16,13]],'#f8e49c');shine(16,7,1.1);
  }
  function snack(f){
    oval(16,25,10,9,'#b14486');oval(16,24,9,8,'#f38ab3');oval(12,21,3,2,'#ffc8d8');
    oval(21,27,2,2,'#ffe2bf');oval(12,28,1.5,1.5,'#ffe2bf');
    shape([[15,17],[13,11],[19,15],[22,10],[22,19]],'#4f9b75');line([[16,18],[16,11]],'#356f5a');
    if(f%2)shine(24,16,1.3);
  }
  kinds.forEach((name,index)=>{
    for(let f=0;f<frames;f++){
      g.save();g.translate(index*sw*frames+f*sw,0);
      // soft pixel-glow behind magical creatures; no network assets.
      if(name!=='hero'&&name!=='snack'){
        oval(16,27,14,12,'#376b7d22');shine(2+f*2,11+f,1.1);
      }
      ({hero,springaroo,skyling,tideling,snack})[name](f);
      g.restore();
    }
  });
  function draw(ctx,name,x,y,frame=0,flip=false,playerId=null) {
    const index=Math.max(0,kinds.indexOf(name));

<script>

    function targetFor(animal){return players.filter(p=>!p.sleep).sort((a,b)=>distance(a,animal)-distance(b,animal))[0];}

    function box(ctx,x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h);}

    function terrain(ctx,time){

      // tiny foreground blossoms, all procedural and repeatable
      for(let x=left;x<right;x++)for(let y=top+1;y<bottom;y++)if(map[y]?.[x]==='ground'&&map[y-1]?.[x]==='empty'&&hash(x,y)%8===1){
        const px=x*TILE+6,py=y*TILE-2;box(ctx,px,py-4,2,5,'#3e8269');box(ctx,px-2,py-6,6,3,'#f39cc3');box(ctx,px,py-7,2,2,'#ffea9f');
      }
    }
    function render(ctx,now){
      ctx.setTransform(2,0,0,2,0,0);
      background(ctx,now);
      ctx.save();ctx.translate(Math.round((Math.random()-.5)*shake),Math.round((Math.random()-.5)*shake));ctx.translate(-Math.round(cameraX),-Math.round(cameraY));
      terrain(ctx,now);
      items.forEach(it=>{if(it.used)return;const bob=Math.sin(now*3+it.x)*2;
        if(it.kind==='snack')WW.art.draw(ctx,'snack',it.x,it.y+8+bob,Math.floor(now*3)%4);
        if(it.kind==='skyKey'||it.kind==='diveKey'||it.kind==='springKey'){
          box(ctx,it.x-4,it.y-4+bob,8,8,it.kind==='skyKey'?'#ffe7a0':it.kind==='springKey'?'#ff94d5':'#adfafa');box(ctx,it.x-2,it.y-7+bob,4,4,'#ffffff');box(ctx,it.x+3,it.y+2+bob,7,2,'#ffde7e');
        }
        if(it.kind==='exit'){
          box(ctx,it.x-12,it.y-28,24,36,'#725771');box(ctx,it.x-8,it.y-25,16,31,shared.skyKey&&shared.diveKey&&shared.springKey?'#6befc6':'#423c6b');
          box(ctx,it.x-5,it.y-20,10,14,'#af9abb');box(ctx,it.x-3,it.y-19,6,10,'#433f7d');box(ctx,it.x+4,it.y-9,2,2,'#ffdc80');
        }
        if(it.kind==='checkpoint') {box(ctx,it.x-2,it.y-22,3,27,'#765968');box(ctx,it.x+1,it.y-22,14,9,'#9bf6c9');}
      });
      animals.forEach(a=>{
        if(!a.alive)return;
        const frame=Math.floor(a.frame)%4;
        WW.art.draw(ctx,a.kind,a.x,a.y,frame,a.dir<0);
        const wary=a.wary;box(ctx,a.x-11,a.y-23,22,4,'#263f46');box(ctx,a.x-10,a.y-22,20*(wary/100),2,wary>40?'#fa8c82':'#a1eaa2');
        if(!wary){box(ctx,a.x-2,a.y-28,4,3,'#ff9eb6');box(ctx,a.x-4,a.y-26,8,3,'#ff9eb6');}
        const chance=Math.round((.12+.86*Math.pow(1-a.wary/100,1.55))*100);
        ctx.fillStyle='#f4fbef';ctx.font='bold 7px sans-serif';
        ctx.fillText(titles[a.kind],a.x-17,a.y-39);
        if(a.wary<100){ctx.fillStyle='#fceab0';ctx.fillText(`Catch ${chance}%`,a.x-17,a.y-30);}
      });
      projectiles.forEach(pr=>{
        const color={snack:'#fe92b7',orb:'#d8bcff',feather:'#f7eec7',bubble:'#9fe4fa',thorn:'#f5ae7a'}[pr.kind];
        box(ctx,pr.x-3,pr.y-3,6,6,'#273e55');box(ctx,pr.x-2,pr.y-2,4,4,color);if(pr.kind==='orb')box(ctx,pr.x-1,pr.y-1,2,2,'#ffffff');
      });
      players.forEach(p=>{
        if(p.invincible>0&&Math.floor(now*13)%2)return;
        if(p.sleep){WW.art.draw(ctx,'hero',p.x,p.y+7,1,p.face<0,p.id);box(ctx,p.x+7,p.y-25,4,5,'#ecf6ff');box(ctx,p.x+12,p.y-31,5,6,'#ecf6ff');}
        else WW.art.draw(ctx,p.form||'hero',p.x,p.y,Math.floor(p.frame)%4,p.face<0,p.id);
        // Colored player markers remain clear even while transformed.
        box(ctx,p.x-8,p.y-35,16,3,'#152e42');box(ctx,p.x-7,p.y-34,14,2,p.id===0?'#ffd782':'#91d2ff');
        ctx.font='bold 8px sans-serif';ctx.fillStyle='#102b41';ctx.fillText(String(p.id+1),p.x-2,p.y-38);
      });
      effects.forEach(e=>box(ctx,e.x,e.y,3,3,e.color));ctx.restore();
      if(!shared.skyKey||!shared.diveKey||!shared.springKey){
        box(ctx,9,H-24,355,16,'#233d50cf');ctx.font='9px monospace';ctx.fillStyle='#fff2c6';ctx.fillText(!shared.springKey?'Double jump as a SPRINGAROO for the canopy gem!':!shared.skyKey?'Fly as a MOONWING to the sky gem!':'Dive as a TIDEFOX for the river gem!',15,H-13);
      }
    }
    hud.hidden=false;say('Catch three magical creatures. Their powers unlock three gems!',3600);
    return {update,render,stop(){hud.hidden=true;message.classList.remove('show');},get state(){return {players,shared,animals,items,cameraX,cameraY,physics:PHYSICS,jumpHeight}}};
  }
  return {start};
})();

</script>
<script>
window.WW = window.WW || {};
WW.main = (() => {
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
  const menu=document.getElementById('menu');const hud=document.getElementById('hud');
  let game=null,last=0,paused=true,screen='home',cancelCalibration=null,customMap=null,pixelsPerTile=1;
  const builtinMap=window.WONDERWOOD_MAP.startsWith('data:')?window.WONDERWOOD_MAP:'src/games/animal-adventure/levels/first-forest.png';
  const panel=(content)=>{menu.hidden=false;menu.innerHTML=`<section class="panel">${content}</section>`;};
  const button=(id,label,kind='secondary')=>`<button class="${kind}" data-action="${id}">${label}</button>`;
  function home(){
    if(game){game.stop();game=null;}paused=true;screen='home';cancelCalibration?.();cancelCalibration=null;
    panel(`<div class="kicker">An adventure arcade for the whole family</div><h1>WONDERWOOD</h1>
      <h2>Three magical powers. Three hidden gems.</h2><p>Befriend and catch fantasy creatures! Springaroo double-jumps, Moonwing flies, Tidefox dives. Each capture gives that player one timed transformation. The deep lake is dangerous unless you become a Tidefox.</p>
      <div class="chips"><span class="chip">Local co-op</span><span class="chip">USB gamepads</span><span class="chip">Offline play</span><span class="chip">Pixel-art world</span></div>
      <div class="buttons">${button('play','▶ PLAY THE FOREST','primary')}${button('settings','⚙ Settings')}${button('calibrate','🎮 Map controller')}${button('level','🗺 Load PNG level')}</div>
      <div class="instructions"><b>P1:</b> A / D move, W jump, S dive, F snack, G magic orb, Q choose animal, T transform, R revive<br>
      <b>P2:</b> J / L move, I jump, K dive, O snack, P orb, H choose, U transform, Y revive<br>
      <b>Controllers:</b> left stick / D-pad move · A jump · B snack · X orb · Y transform · RB choose · LB revive</div>
      <div class="hint">${customMap?'Custom level loaded for this session.':'First Forest: Canopy Gem + Sky Gem + River Gem.'} &nbsp; · &nbsp; ${WW.input.pads().length} controller(s) detected</div>`);
  }
  async function play() {
    const url=customMap||builtinMap;
    if(game){game.stop();game=null;}
    paused=true;screen='loading';
    panel('<div class="kicker">Unfolding the forest map</div><h2>Loading adventure…</h2>');
    try{
      const level=await WW.levels.load(url,pixelsPerTile);
      if(level.warnings.some(w=>w.startsWith('No ')))throw Error(level.warnings.join(' · '));
      WW.input.reset();game=WW.games.animals.start(level);menu.hidden=true;paused=false;screen='playing';last=0;
      if(level.warnings.length)game && console.warn('Level warnings:',level.warnings);
      if(document.activeElement instanceof HTMLElement)document.activeElement.blur();
    }catch(error){screen='error';panel(`<h2>Couldn't read this level</h2><p class="warning" id="error"></p><div class="buttons">${button('home','Back to menu')}</div>`);document.getElementById('error').textContent=error.message;}
  }
  function settings(){
    screen='settings';const settings=WW.storage.data.settings;
    panel(`<div class="kicker">Wonderwood Arcade</div><h2>Game settings</h2>
      <p>Controls and progress are stored in this browser. Export a save to keep a backup when you move the HTML file.</p>
      <div class="row"><label for="players">Players</label><select id="players"><option value="1" ${settings.players===1?'selected':''}>1 player</option><option value="2" ${settings.players===2?'selected':''}>2 players</option></select></div>
      <label class="toggle"><input id="rumble" type="checkbox" ${settings.rumble?'checked':''}> Controller vibration (if supported)</label>
      <div class="buttons">${button('save-settings','Save settings','primary')}${button('export','Export save')}${button('import','Import save')}${button('home','Back')}</div>
      <input id="save-file" type="file" accept="application/json,.json" hidden>
      <div class="instructions">Controller vibration support varies by gamepad, Linux driver, and Firefox version.</div>`);
    document.getElementById('save-file').addEventListener('change',async(e)=>{
      const file=e.target.files[0];if(!file)return;
      try{await WW.storage.importSave(file);settings();}
      catch(err){alert(err.message);}
    });
  }
  function calibration(){
    screen='calibration';const pads=WW.input.pads();if(!pads.length){panel(`<div class="kicker">Controller setup</div><h2>No gamepad detected</h2><p>Connect a USB controller, then press any button on it while Firefox is focused. The browser only exposes gamepads after interaction.</p><div class="buttons">${button('calibrate','Try again','primary')}${button('home','Back')}</div>`);return;}
    const p=pads[0];
    panel(`<div class="kicker">Controller setup · ${p.index+1}</div><h2>Press the requested control</h2><p id="calibration-step"></p><p class="hint">Release each control before the next step. Saves automatically by controller name.</p><div class="buttons">${button('home','Cancel')}</div>`);
    const display={left:'MOVE LEFT',right:'MOVE RIGHT',down:'MOVE / DIVE DOWN',jump:'JUMP / SWIM UP',snack:'THROW SNACK',orb:'THROW MAGIC ORB',cycle:'CHOOSE ANIMAL FORM',transform:'TRANSFORM',revive:'REVIVE'};
    cancelCalibration=WW.input.calibrate(p.index,(step,actions)=>{
      const element=document.getElementById('calibration-step');
      if(element)element.textContent=`${step+1} / ${actions.length} — ${display[actions[step]]}`;
    },()=>{cancelCalibration=null;WW.input.rumble(0,.6,220);panel(`<h2>Controller saved!</h2><p>The mapping will load automatically whenever this controller connects.</p><div class="buttons">${button('home','Back to menu','primary')}</div>`);});
  }
  function level(){
    screen='level';panel(`<div class="kicker">For level creators · AI-assisted maps</div><h2>Load your own PNG map</h2>
      <p>Use the palette from README.md. One pixel is one tile by default; for an AI-generated image with large color blocks, enter the number of image pixels per tile. The parser uses center sampling and approximate colors.</p>
      <div class="row"><label>PNG <input type="file" id="level-file" accept="image/png"></label><label>Pixels per tile <input id="tile-size" type="number" min="1" max="64" value="1" style="width:70px"></label></div>
      <p class="hint">A green start marker and a red exit marker are required. Unknown colors become empty terrain and are reported in the console.</p>
      <div class="buttons">${button('load-level','Use this level','primary')}${button('reset-level','Use built-in level')}${button('home','Back')}</div>`);
  }
  function pause(){if(!game||screen!=='playing')return;paused=true;screen='paused';panel(`<div class="kicker">Adventure on hold</div><h2>Paused</h2><p>Snack time? Your forest friends will still be here.</p><div class="buttons">${button('resume','Resume','primary')}${button('restart','Restart level')}${button('home','Main menu')}</div>`);}
  function win(wins){paused=true;screen='won';panel(`<div class="kicker">A forest full of friends</div><h1>YOU DID IT!</h1><h2>All three gems found. The gate is open!</h2><p>Your teamwork saved the day. Adventures completed: ${wins}. The animals are already getting up to more mischief.</p><div class="buttons">${button('restart','Play again','primary')}${button('home','Arcade menu')}</div>`);}
  menu.addEventListener('click',async e=>{
    const id=e.target.closest('button')?.dataset.action;
    if(!id)return;
    if(id==='play'||id==='restart')await play();
    if(id==='home')home();
    if(id==='settings')settings();
    if(id==='calibrate')calibration();
    if(id==='level')level();
    if(id==='resume'&&screen==='paused'){paused=false;screen='playing';menu.hidden=true;WW.input.reset();last=0;}
    if(id==='save-settings'){WW.storage.data.settings.players=Number(document.getElementById('players').value);WW.storage.data.settings.rumble=document.getElementById('rumble').checked;WW.storage.save();home();}
    if(id==='export')WW.storage.exportSave();
    if(id==='import')document.getElementById('save-file').click();
    if(id==='reset-level'){customMap=null;pixelsPerTile=1;home();}
    if(id==='load-level'){
      const file=document.getElementById('level-file').files[0];if(!file){alert('Select a PNG file first.');return;}
      const size=Number(document.getElementById('tile-size').value);
      if(!Number.isInteger(size)||size<1||size>64){alert('Pixels per tile must be 1–64.');return;}
      customMap=URL.createObjectURL(file);pixelsPerTile=size;await play();
    }
  });
  addEventListener('keydown',e=>{if(e.code!=='Escape')return;if(screen==='playing'){e.preventDefault();pause();}else if(screen==='paused'){e.preventDefault();paused=false;screen='playing';menu.hidden=true;WW.input.reset();last=0;}});
  function idle(now){
    ctx.setTransform(2,0,0,2,0,0);
    const t=now*.001;const sky=ctx.createLinearGradient(0,0,0,270);sky.addColorStop(0,'#73b6cf');sky.addColorStop(1,'#dbedcf');ctx.fillStyle=sky;ctx.fillRect(0,0,480,270);
    for(let layer=0;layer<3;layer++){
      const h=135+layer*38;ctx.fillStyle=['#aacfc1','#77b0a9','#427e7a'][layer];ctx.beginPath();ctx.moveTo(0,270);
      for(let x=0;x<500;x+=16)ctx.lineTo(x,h+Math.sin(x*.023+layer+t*.06)*14+Math.sin(x*.09)*6);ctx.lineTo(480,270);ctx.fill();
    }
    for(let i=0;i<25;i++){const x=i*24+(Math.sin(i*2)*8);ctx.fillStyle='#285963';ctx.fillRect(x,201,5,60);ctx.fillStyle=i%2?'#478b79':'#57987b';ctx.fillRect(x-9,178+Math.sin(i)*12,24,28);}
    ctx.fillStyle='#89bd71';ctx.fillRect(0,244,480,26);
    for(let x=0;x<480;x+=16){ctx.fillStyle='#528b69';ctx.fillRect(x,243,16,3);ctx.fillStyle='#a0d181';ctx.fillRect(x+4,240,3,4);}
    WW.art.draw(ctx,'springaroo',85,244,Math.floor(t*3)%4);WW.art.draw(ctx,'skyling',375,183+Math.sin(t*2)*5,Math.floor(t*6)%4);WW.art.draw(ctx,'tideling',135,244,Math.floor(t*3)%4);WW.art.draw(ctx,'hero',235,242,Math.floor(t*2)%4);
  }
  function frame(now){const dt=last?Math.min((now-last)/1000,.05):0;last=now;if(game){if(!paused)game.update(dt);game.render(ctx,now/1000);}else idle(now);requestAnimationFrame(frame);}
  WW.storage.load();WW.input.syncAssignments();home();requestAnimationFrame(frame);
  return {home,pause,win,play,get game(){return game}};
})();

</script>
